function buscarReg(){
  const q=(document.getElementById('srQ')?.value||'').toLowerCase();
  const p=document.getElementById('srP')?.value||'';
  const e=document.getElementById('srE')?.value||'';
  const ti=document.getElementById('srTi')?.value||'';
  const a=document.getElementById('srA')?.value||'';
  let r=[...BLOQUES].sort((x,y)=>Number(y.id)-Number(x.id));
  if(q)r=r.filter(x=>x.titulo?.toLowerCase().includes(q)||String(x.id).includes(q)||x.solicitante?.toLowerCase().includes(q)||x.comentario?.toLowerCase().includes(q));
  if(p)r=r.filter(x=>x.responsable===p);
  if(e)r=r.filter(x=>x.estado===e);
  if(ti)r=r.filter(x=>x.tipoIngreso===ti);
  if(a)r=r.filter(x=>x.area===a);
  const c=document.getElementById('srCnt');if(c)c.textContent=`${r.length} bloque${r.length!==1?'s':''} encontrado${r.length!==1?'s':''}`;
  renderRegB(r);
}

async function savEdB(id){
  const campos={
    1:document.getElementById('eb_tin_'+id)?.value||'',
    2:document.getElementById('eb_tip_'+id)?.value||'',
    3:document.getElementById('eb_tit_'+id)?.value||'',
    4:document.getElementById('eb_are_'+id)?.value||'',
    5:document.getElementById('eb_sol_'+id)?.value||'',
    6:document.getElementById('eb_res_'+id)?.value||'',
    7:document.getElementById('eb_urg_'+id)?.value||'',
    8:document.getElementById('eb_imp_'+id)?.value||'',
    9:document.getElementById('eb_com_'+id)?.value||'',
    10:document.getElementById('eb_est_'+id)?.value||'',
    15:parseFloat(document.getElementById('eb_hhp_'+id)?.value)||''
  };
  await apiPost({accion:'actualizar',id,campos});
  const idx=BLOQUES.findIndex(b=>String(b.id)===String(id));
  if(idx>-1){
    const b=BLOQUES[idx];
    b.tipoIngreso=campos[1];b.tipoBloque=campos[2];b.titulo=campos[3];
    b.area=campos[4];b.solicitante=campos[5];b.responsable=campos[6];
    b.urgente=campos[7];b.importante=campos[8];b.comentario=campos[9];
    b.estado=campos[10];b.hhPlan=campos[15];
  }
  cefT(id);toast('Bloque actualizado','ok');buscarReg();
}

async function delB(id){
  await apiPost({accion:'eliminar',id});
  const idx=BLOQUES.findIndex(b=>String(b.id)===String(id));
  if(idx>-1)BLOQUES.splice(idx,1);
  invalidateCache();
  toast('Bloque eliminado','ok');buscarReg();
  if(document.getElementById('calWrap'))calRender();
}

// Detecta si [ini,ter] cruza el almuerzo de 'responsable' en 'fecha'
// Retorna: null | {type:'span',lunch} | {type:'partial',lunch,where:'start'|'end'}
function checkLunchConflict(responsable, fecha, ini, ter) {
  const lunch = getLunchFor(responsable, fecha);
  if (!lunch.ini || !lunch.fin) return null;
  const a = t2m(ini), b = t2m(ter);
  const li = t2m(lunch.ini), lf = t2m(lunch.fin);
  if (a >= lf || b <= li) return null;                     // sin overlap
  if (a < li && b > lf)   return {type:'span', lunch};     // cruza completo
  return {type:'partial', lunch, where: a < li ? 'end' : 'start'};
}

async function ejecutarProgramacion(bloqueId, fec, ini, ter, motivo, esReprog) {
  cerrarModal();
  const b = BLOQUES.find(x => String(x.id) === String(bloqueId)); if (!b) return;
  const idx = BLOQUES.findIndex(x => String(x.id) === String(bloqueId));
  if (idx > -1) BLOQUES[idx] = {...BLOQUES[idx], estado:'Programado', fechaProg:fec, horaInicioProg:ini, horaFinProg:ter};
  toast(`✅ Bloque #${b.id} ${esReprog?'reprogramado':'programado'}: ${fec} ${ini}–${ter}`,'ok');
  calRender();
  syncCache();
  const p = esReprog
    ? apiPost({accion:'reprogramar', bloqueId:b.id, titulo:b.titulo, responsable:b.responsable,
        fechaOriginal:b.fechaProg, horaInicioOriginal:b.horaInicioProg, horaFinOriginal:b.horaFinProg,
        fechaNueva:fec, horaInicioNueva:ini, horaFinNueva:ter, motivo, esUrgencia:false, reprogramadoPor:SESSION.nombre})
    : apiPost({accion:'actualizar', id:b.id, campos:{10:'Programado', 16:fec, 17:ini, 18:ter}});
  p.catch(() => toast('Error al guardar','er'));
}

async function ejecutarSplit(bloqueId, fec, motivo, esReprog) {
  const s1Ini = document.getElementById('sp1Ini')?.value;
  const s1Ter = document.getElementById('sp1Ter')?.value;
  const s2Ini = document.getElementById('sp2Ini')?.value;
  const s2Ter = document.getElementById('sp2Ter')?.value;
  if (!s1Ini||!s1Ter||!s2Ini||!s2Ter) { toast('Completa todos los horarios','warn'); return; }
  if (t2m(s1Ter)<=t2m(s1Ini)) { toast('Bloque 1: fin debe ser mayor que inicio','warn'); return; }
  if (t2m(s2Ter)<=t2m(s2Ini)) { toast('Bloque 2: fin debe ser mayor que inicio','warn'); return; }

  const b = BLOQUES.find(x => String(x.id) === String(bloqueId)); if (!b) return;
  cerrarModal();

  // Actualizar bloque 1 (el original)
  await ejecutarProgramacion(bloqueId, fec, s1Ini, s1Ter, motivo, esReprog);

  // Crear bloque 2 (nuevo)
  const nuevoBloque = {
    tipoIngreso: b.tipoIngreso, tipoBloque: b.tipoBloque,
    titulo: b.titulo + ' (2/2)', area: b.area,
    solicitante: b.solicitante, responsable: b.responsable,
    urgente: b.urgente, importante: b.importante,
    comentario: (b.comentario||'') + ' [dividido por almuerzo]',
    estado: 'Programado', fechaReal:'', horaInicio:'', horaFin:'',
    hhReal: 0, hhPlan: calcHHRaw(s2Ini, s2Ter),
    fechaProg: fec, horaInicioProg: s2Ini, horaFinProg: s2Ter,
  };
  const tempId = `tmp_${Date.now()}`;
  BLOQUES.push({...nuevoBloque, id:tempId, fechaIngreso: todayStr()});
  syncCache();
  calRender();
  toast(`✅ Dividido: Bloque 1 ${s1Ini}–${s1Ter} · Bloque 2 ${s2Ini}–${s2Ter}`,'ok');

  apiPost({accion:'insertar', bloque:nuevoBloque})
    .then(r => {
      if (r?.ok) {
        const ti = BLOQUES.findIndex(x => x.id === tempId);
        if (ti > -1) BLOQUES[ti].id = r.id;
        syncCache();
      }
    }).catch(() => toast('Error al guardar bloque 2','er'));
}

async function guardarAlmuerzoOvLocal(nombre, fecha) {
  const ini = document.getElementById('ovIni')?.value;
  const fin = document.getElementById('ovFin')?.value;
  if (!ini || !fin) { toast('Completa ambos horarios','warn'); return; }
  if (t2m(fin) <= t2m(ini)) { toast('La hora fin debe ser posterior al inicio','warn'); return; }
  LUNCH_OVERRIDES[`${nombre}|${fecha}`] = lunchEntry(ini, fin);
  if (!LISTAS['AlmuerzoOv']) LISTAS['AlmuerzoOv'] = [];
  const idx = LISTAS['AlmuerzoOv'].findIndex(v => v.startsWith(`${nombre}|${fecha}|`));
  const val = `${nombre}|${fecha}|${ini}|${fin}`;
  if (idx > -1) LISTAS['AlmuerzoOv'][idx] = val; else LISTAS['AlmuerzoOv'].push(val);
  saveLocalOverrides(); // persiste en localStorage — sobrevive cierre de navegador
  syncCache();          // actualiza sessionStorage inmediatamente
  cerrarModal();
  toast(`🍽 Almuerzo del ${fecha} actualizado`,'ok');
  calRender();
  apiPost({accion:'guardarAlmuerzoOv', nombre, fecha, ini, fin})
    .catch(() => {}); // silencioso — localStorage ya lo tiene guardado
}

async function eliminarAlmuerzoOvLocal(nombre, fecha) {
  delete LUNCH_OVERRIDES[`${nombre}|${fecha}`];
  if (LISTAS['AlmuerzoOv'])
    LISTAS['AlmuerzoOv'] = LISTAS['AlmuerzoOv'].filter(v => !v.startsWith(`${nombre}|${fecha}|`));
  saveLocalOverrides(); // actualiza localStorage sin ese override
  syncCache();
  cerrarModal();
  toast('↩ Restaurado al predeterminado','ok');
  calRender();
  apiPost({accion:'eliminarAlmuerzoOv', nombre, fecha})
    .catch(() => {});
}

async function guardarHorarioAlmuerzo() {
  const ini = document.getElementById('alIni')?.value;
  const fin = document.getElementById('alFin')?.value;
  if (!ini || !fin) { toast('Completa ambos horarios','warn'); return; }
  if (t2m(fin) <= t2m(ini)) { toast('La hora fin debe ser posterior al inicio','warn'); return; }

  // Actualizar local inmediatamente
  SESSION.almuerzoIni = ini;
  SESSION.almuerzoFin = fin;
  LUNCH_MAP[SESSION.nombre] = { ini, fin, start: hhmm2dec(ini), end: hhmm2dec(fin) };
  cerrarModal();
  toast('🍽 Almuerzo actualizado','ok');
  calRender();

  // Guardar en Sheets en background
  apiPost({accion:'guardarAlmuerzo', usuario:SESSION.usuario, ini, fin})
    .catch(() => toast('Error al guardar — intenta de nuevo','er'));
}

// ── Control gestión diaria ─────────────────────────────────────────────
let _ctrlDayOffset = 0;

function ctrlSetDay(offset) {
  _ctrlDayOffset = offset;
  // Update button styles
  ['Ayer','Hoy','Man'].forEach((n,i)=>{
    const btn=document.getElementById('ctrlBtn'+n);
    if(!btn)return;
    const active=(i-1)===offset;
    btn.style.background=active?'var(--navy)':'';
    btn.style.color=active?'#fff':'';
    btn.className=active?'btn sm':'btn sm ghost';
  });
  ctrlRenderDay();
}

function ctrlRenderDay() {
  const body = document.getElementById('ctrlBody'); if(!body)return;
  const today=new Date();
  const target=new Date(today); target.setDate(today.getDate()+_ctrlDayOffset);
  const ds=dateStr(target);
  const dow=target.getDay();
  const dayLabel=_ctrlDayOffset===-1?'Ayer':_ctrlDayOffset===0?'Hoy':'Mañana';
  const dateLabel=target.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

  // Get current filter users
  const dashEl=document.getElementById('fb-plan');
  let users;
  if(dashEl) {
    const chks=[...dashEl.querySelectorAll('.uchk')].filter(c=>c.checked).map(c=>c.value);
    users=chks.length>0?chks:PERSONAS;
  } else {
    users=SESSION.rol==='admin'?PERSONAS:[SESSION.nombre];
  }

  if(!SCHEDULE[dow]) {
    body.innerHTML=`<div class="al ok"><span class="al-ico">📅</span>
      <div class="al-txt">${dayLabel} ${dateLabel} — Día no laborable</div></div>`;
    return;
  }

  const workStart=SCHEDULE[dow][0], workEnd=SCHEDULE[dow][1];
  const lunchStart=SCHEDULE[dow][2], lunchEnd=SCHEDULE[dow][3];
  const totalWorkHrs=(workEnd-workStart)-(lunchEnd-lunchStart);

  // Per user analysis
  const hoyStr = todayStr();
  const nowMin = new Date().getHours()*60+new Date().getMinutes();
  const userRows = users.map(p => {
    const bProg = BLOQUES.filter(b=>b.responsable===p&&b.estado==='Programado'&&b.fechaProg===ds);
    const bConf = BLOQUES.filter(b=>b.responsable===p&&b.estado==='Confirmado'&&b.fechaReal===ds);

    // ── Part 1: Unscheduled hours (checkGaps) ────────────────────────────
    const gaps=checkGaps(p,ds);
    const gapHrs=gaps.reduce((s,g)=>{
      const [ini,ter]=g.split('–');
      try{return s+calcHHRaw(ini.trim(),ter.trim());}catch(e){return s;}
    },0);

    // ── Part 2: Unconfirmed programmed blocks whose end time has passed ──
    const sinConf=bProg.filter(b=>{
      if(ds>hoyStr) return false;
      const end=t2m(b.horaFinProg||'23:59');
      return ds<hoyStr||(ds===hoyStr&&end<=nowMin);
    });

    const allOk=gaps.length===0&&sinConf.length===0;
    const gapHtml=gaps.length>0?`
      <div style="margin-top:6px">
        <div style="font-weight:600;color:var(--amber);font-size:11px;margin-bottom:3px">
          🕐 ${gaps.length} rango${gaps.length!==1?'s':''} sin programar (${gapHrs.toFixed(1)}h libre${gapHrs!==1?'s':''}):</div>
        ${gaps.map(g=>`<div style="font-size:11px;background:#fff3cd;border-radius:4px;padding:3px 8px;margin-bottom:2px;display:flex;justify-content:space-between;cursor:pointer"
          onclick="cerrarModal&&cerrarModal();goSub('A','agenda')">
          <span>⏰ ${g}</span><span style="color:var(--amber);font-size:10px">→ Programar</span>
        </div>`).join('')}
      </div>`:'';
    const confHtml=sinConf.length>0?`
      <div style="margin-top:6px">
        <div style="font-weight:600;color:var(--red);font-size:11px;margin-bottom:3px">
          ⚠️ ${sinConf.length} bloque${sinConf.length!==1?'s':''} sin confirmar:</div>
        ${sinConf.map(b=>`<div style="font-size:11px;background:#f8d7da;border-radius:4px;padding:3px 8px;margin-bottom:2px;display:flex;justify-content:space-between;cursor:pointer"
          onclick="abrirModalBloque(${b.id})">
          <span>#${b.id} ${b.titulo.substring(0,25)}</span>
          <span style="color:var(--red);font-size:10px">→ Confirmar</span>
        </div>`).join('')}
      </div>`:'';

    return `<div style="border:1px solid ${allOk?'#c3e6cb':gaps.length>0&&sinConf.length>0?'#f5c6cb':gaps.length>0?'#ffeeba':'#f5c6cb'};
      border-radius:8px;padding:10px 12px;margin-bottom:8px;background:${allOk?'#f0faf4':'#fff'}">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-weight:600;font-size:13px">${shortName(p)}</div>
        <div style="font-size:11px;color:var(--muted)">${totalWorkHrs}h jornada · ${bProg.length+bConf.length} bloque${bProg.length+bConf.length!==1?'s':''} prog.</div>
        <span style="font-size:16px">${allOk?'✅':gaps.length>0&&sinConf.length>0?'🔴':gaps.length>0?'🟡':'🟠'}</span>
      </div>
      ${gapHtml}${confHtml}
      ${allOk?'<div style="font-size:11px;color:#155724;margin-top:4px">✅ Jornada completa — todo programado y confirmado</div>':''}
    </div>`;
  }).join('');

  body.innerHTML=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">
    ${dayLabel} · ${dateLabel}</div>${userRows}`;
}
