}

function buildDashReporte(f) {
  if (!f) f = getDashFilterReporte();
  const bloques = BLOQUES.filter(b => {
    if (f.users.length>0 && !f.users.includes(b.responsable)) return false;
    if (f.area && b.area !== f.area) return false;
    const fd = b.fechaProg || b.fechaIngreso || '';
    if (f.desde && fd < f.desde) return false;
    if (f.hasta && fd > f.hasta) return false;
    return true;
  });

  if (bloques.length === 0) return `<div class="al w"><span class="al-ico">📭</span>
    <div class="al-txt">No hay bloques para el período y filtros seleccionados.</div></div>`;

  const total = bloques.length;
  const periodoLabel = `${f.desde} → ${f.hasta}`;

  // ── KPI 1: Distribución Eisenhower ──
  const eis = {
    ui: bloques.filter(b=>b.urgente==='Si'&&b.importante==='Si').length,
    ni: bloques.filter(b=>b.urgente!=='Si'&&b.importante==='Si').length,
    un: bloques.filter(b=>b.urgente==='Si'&&b.importante!=='Si').length,
    nn: bloques.filter(b=>b.urgente!=='Si'&&b.importante!=='Si').length,
  };
  const pctNiPlanif = total>0 ? Math.round(eis.ni/total*100) : 0;
  const semEis = semaforo(pctNiPlanif, 50, 30);
  const eisInsight = pctNiPlanif >= 50
    ? `✅ El ${pctNiPlanif}% del trabajo es Importante pero no urgente: el equipo opera de forma planificada.`
    : pctNiPlanif >= 30
    ? `⚠️ Solo el ${pctNiPlanif}% del trabajo es planificado estratégico. Hay margen de mejora en planificación.`
    : `🚨 Solo el ${pctNiPlanif}% es trabajo planificado importante. La operación es mayormente reactiva.`;
  const eisCard = `
  <div class="cw" style="border-left:4px solid ${semEis.color};grid-column:1/-1">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:18px">🧭</span>
      <div style="flex:1">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Distribución Eisenhower</div>
        <div style="font-size:11px;color:var(--txt);margin-top:2px">${periodoLabel}</div>
      </div>
      <span style="font-size:20px">${semEis.ico}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      ${[
        ['⚡ Urgente + Importante', eis.ui, 'var(--red)'],
        ['📅 Importante, no urgente', eis.ni, 'var(--green)'],
        ['👥 Urgente, no importante', eis.un, 'var(--amber)'],
        ['🗑 Ni urgente ni importante', eis.nn, 'var(--muted)']
      ].map(([l,v,c])=>`
        <div style="background:var(--bg2);border-radius:6px;padding:8px">
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">${l}</div>
          <div style="font-family:Montserrat,sans-serif;font-size:20px;font-weight:800;color:${c}">${v}</div>
          <div style="font-size:10px;color:var(--muted)">${total>0?Math.round(v/total*100):0}%</div>
        </div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--txt);line-height:1.5;padding-top:6px;border-top:1px solid var(--border)">${eisInsight}</div>
  </div>`;

  // ── KPI 2: Express vs Simple (Reactividad real) ──
  const express = bloques.filter(b=>b.tipoBloque==='Express');
  const simple  = bloques.filter(b=>b.tipoBloque!=='Express');
  const pctExpress = total>0 ? Math.round(express.length/total*100) : 0;
  const semExpress = semaforo(pctExpress, 30, 50, true);
  // Desglose por persona
  const expressPers = f.users.map(p=>{
    const pB=bloques.filter(b=>b.responsable===p);
    const pE=pB.filter(b=>b.tipoBloque==='Express').length;
    const pct=pB.length>0?Math.round(pE/pB.length*100):0;
    const col=pct>50?'var(--red)':pct>30?'var(--amber)':'var(--green)';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0">
      <span style="font-size:11px">${shortName(p)}</span>
      <span style="font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;color:${col}">${pct}%</span>
    </div>`;
  }).join('');
  const expressInsight = pctExpress <= 30
    ? `✅ Solo el ${pctExpress}% del trabajo llega como Express. El equipo opera de forma planificada.`
    : pctExpress <= 50
    ? `⚠️ ${pctExpress}% de los bloques son Express (reactivos). Aumentar planificación semanal reduciría la reactividad.`
    : `🚨 ${pctExpress}% del trabajo llega sin planificación (Express). El equipo opera en modo reactivo — revisar SLAs con áreas solicitantes.`;

  // ── KPI 3: Fragmentación (usando HH_Real) ──
  const ejecutados = bloques.filter(b=>(parseFloat(b.hhReal)||0)>0);
  const fragmentados = ejecutados.filter(b=>(parseFloat(b.hhReal)||0)<0.5);
  const pctFrag = ejecutados.length>0 ? Math.round(fragmentados.length/ejecutados.length*100) : 0;
  const semFrag = semaforo(pctFrag, 30, 50, true);
  // Desglose por persona
  const fragPers = f.users.map(p=>{
    const pEjec=ejecutados.filter(b=>b.responsable===p);
    const pFrag=pEjec.filter(b=>(parseFloat(b.hhReal)||0)<0.5).length;
    const pct=pEjec.length>0?Math.round(pFrag/pEjec.length*100):null;
    const col=pct>50?'var(--red)':pct>30?'var(--amber)':'var(--green)';
    const avgMin=pEjec.length>0?Math.round(pEjec.reduce((s,b)=>s+(parseFloat(b.hhReal)||0),0)/pEjec.length*60):0;
    return pct!==null?`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0">
      <span style="font-size:11px">${shortName(p)}</span>
      <span style="font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;color:${col}">${pct}% <span style="font-size:10px;font-weight:400;color:var(--muted)">(prom ${avgMin}min)</span></span>
    </div>`:'';
  }).join('');
  const fragInsight = pctFrag <= 30
    ? `✅ Baja fragmentación (${pctFrag}% de bloques <30min). Los bloques tienen duración adecuada para trabajo profundo.`
    : pctFrag <= 50
    ? `⚠️ ${pctFrag}% de bloques ejecutados duran menos de 30 min. Evalúa agrupar tareas similares para reducir cambio de contexto.`
    : `🚨 Alta fragmentación: ${pctFrag}% de los bloques duran <30 min. Alto costo de cambio de contexto — oportunidad de agrupar o estandarizar.`;

  // ── KPI 4: Ratio de Estimación (solo Simple con HHP>0) ──
  const conAmbos = bloques.filter(b=>b.tipoBloque!=='Express'&&(parseFloat(b.hhPlan)||0)>0&&(parseFloat(b.hhReal)||0)>0);
  const ratioPers = f.users.map(p=>{
    const pB=conAmbos.filter(b=>b.responsable===p);
    if(!pB.length)return null;
    const ratio=Math.round(pB.reduce((s,b)=>s+(parseFloat(b.hhReal)||0)/(parseFloat(b.hhPlan)||1),0)/pB.length*100)/100;
    const col=ratio>=0.85&&ratio<=1.15?'var(--green)':ratio<=1.5?'var(--amber)':'var(--red)';
    const txt=ratio>1?`subestima ${Math.round((ratio-1)*100)}%`:`sobrestima ${Math.round((1-ratio)*100)}%`;
    return {p,ratio,col,txt,n:pB.length};
  }).filter(Boolean);
  const ratioGlobal = conAmbos.length>0
    ? Math.round(conAmbos.reduce((s,b)=>s+(parseFloat(b.hhReal)||0)/(parseFloat(b.hhPlan)||1),0)/conAmbos.length*100)/100
    : null;
  const semRatio = ratioGlobal!==null
    ? semaforo(ratioGlobal>=0.85&&ratioGlobal<=1.15?1:ratioGlobal<=1.5?0.5:0, 0.9, 0.5)
    : {color:'var(--muted)',ico:'⚪'};
  const ratioRows = ratioPers.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0">
    <span style="font-size:11px">${shortName(r.p)}</span>
    <span style="font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;color:${r.col}">${r.ratio}x <span style="font-size:10px;font-weight:400;color:var(--muted)">(${r.txt}, n=${r.n})</span></span>
  </div>`).join('');
  const ratioInsight = ratioGlobal===null ? 'Sin datos suficientes de tareas Simple con HH planificadas y reales.'
    : ratioGlobal>=0.85&&ratioGlobal<=1.15 ? `✅ Estimaciones precisas (ratio ${ratioGlobal}x). Las tareas Simple toman lo previsto.`
    : ratioGlobal<=1.5 ? `⚠️ Ratio promedio ${ratioGlobal}x — el equipo subestima en promedio un ${Math.round((ratioGlobal-1)*100)}%.`
    : `🚨 Ratio ${ratioGlobal}x: las tareas toman un ${Math.round((ratioGlobal-1)*100)}% más de lo estimado. Revisar metodología de estimación.`;
  const ratioDisplay = ratioGlobal!==null ? ratioGlobal+'x' : 'N/D';

  // ── KPI 5: Carga por Persona ──
  const cargaPers = {};
  bloques.forEach(b=>{
    const p = b.responsable||'Sin asignar';
    if (!cargaPers[p]) cargaPers[p] = {plan:0,real:0,n:0};
    cargaPers[p].plan += parseFloat(b.hhPlan)||0;
    cargaPers[p].real += parseFloat(b.hhReal)||0;
    cargaPers[p].n++;
  });
  const maxHH = Math.max(...Object.values(cargaPers).map(c=>c.real),1);
  const cargaRows = Object.entries(cargaPers).sort((a,b)=>b[1].real-a[1].real).map(([p,c])=>{
    const pct = maxHH > 0 ? Math.round(c.real/maxHH*100) : 0;
    const sem = semaforo(c.real, 0, 0, false); // color based on balance
    const balance = c.plan > 0 ? Math.round(c.real/c.plan*100) : 0;
    const balColor = balance>=80&&balance<=120 ? 'var(--green)' : balance>=60&&balance<=140 ? 'var(--amber)' : 'var(--red)';
    return `<div class="br">
      <div class="bl2" title="${p}">${shortName(p)}</div>
      <div class="bt2"><div class="bf t" style="width:${pct}%"></div></div>
      <div class="bv" style="min-width:90px;text-align:right">
        ${Math.round(c.real*10)/10}h real
        <span style="font-size:10px;color:${balColor};margin-left:4px">(${balance}%)</span>
      </div>
    </div>`;
  }).join('');
  const cargaInsight = (()=>{
    const entries = Object.entries(cargaPers);
    if (entries.length < 2) return `Datos de una sola persona en el período.`;
    const vals = entries.map(([,c])=>c.real);
    const max = Math.max(...vals), min = Math.min(...vals);
    const ratio = min > 0 ? Math.round(max/min*10)/10 : max;
    if (ratio <= 1.5) return `✅ Carga equilibrada entre personas (ratio máx/mín: ${ratio}x).`;
    if (ratio <= 2.5) return `⚠️ Diferencia de carga de ${ratio}x entre personas. Revisar distribución de trabajo.`;
    return `🚨 Desequilibrio de carga de ${ratio}x. Una persona concentra mucho más trabajo que las demás.`;
  })();

  // ── KPI 6: Demanda por Área Solicitante (con % urgente) ──
  const demandaArea = {};
  bloques.forEach(b=>{
    const a = b.area||'Sin área';
    if (!demandaArea[a]) demandaArea[a] = {n:0,hh:0,urgente:0};
    demandaArea[a].n++;
    demandaArea[a].hh += parseFloat(b.hhReal)||parseFloat(b.hhPlan)||0;
    if(b.urgente==='Si') demandaArea[a].urgente++;
  });
  const maxDA = Math.max(...Object.values(demandaArea).map(d=>d.hh),1);
  const areaRows = Object.entries(demandaArea).sort((a,b)=>b[1].hh-a[1].hh).map(([a,d])=>{
    const pctUrg = d.n>0?Math.round(d.urgente/d.n*100):0;
    const urgCol = pctUrg>60?'var(--red)':pctUrg>30?'var(--amber)':'var(--muted)';
    return `<div class="br">
      <div class="bl2" title="${a}">${a.length>16?a.substring(0,15)+'…':a}</div>
      <div class="bt2"><div class="bf r" style="width:${Math.round(d.hh/maxDA*100)}%"></div></div>
      <div class="bv" style="min-width:110px;text-align:right">${Math.round(d.hh*10)/10}h
        <span style="font-size:10px;color:${urgCol};margin-left:4px">${pctUrg}% urg.</span>
      </div>
    </div>`;
  }).join('');
  const topArea = Object.entries(demandaArea).sort((a,b)=>b[1].hh-a[1].hh)[0];
  const topAreaUrgPct = topArea ? Math.round(topArea[1].urgente/topArea[1].n*100) : 0;
  const demandaInsight = topArea
    ? `<strong>${topArea[0]}</strong> lidera con ${Math.round(topArea[1].hh*10)/10}h (${topAreaUrgPct}% urgente).${topAreaUrgPct>60?' ⚠️ Alta proporción de urgentes — revisar SLA con esta área.':''} ${Object.keys(demandaArea).length} áreas activas.`
    : 'Sin datos de área suficientes.';

  // ── KPI 7: Tareas Recurrentes (por primeras 3 palabras) ──
  const tituloMap = {};
  bloques.forEach(b=>{
    const palabras = (b.titulo||'').trim().split(/\s+/).slice(0,3).join(' ').toLowerCase();
    if(!palabras||palabras.length<4) return;
    if(!tituloMap[palabras]) tituloMap[palabras]={count:0,titulos:new Set(),hhReal:0};
    tituloMap[palabras].count++;
    tituloMap[palabras].titulos.add((b.titulo||'').trim());
    tituloMap[palabras].hhReal+=parseFloat(b.hhReal)||0;
  });
  const recurrentes = Object.entries(tituloMap)
    .filter(([,d])=>d.count>=2)
    .sort((a,b)=>b[1].count-a[1].count);
  const estandarizar = recurrentes.filter(([,d])=>d.count>=3);
  const nRecurrentes = recurrentes.reduce((s,[,d])=>s+d.count,0);
  const pctRecurr = total>0 ? Math.round(nRecurrentes/total*100) : 0;
  const semRecurr = semaforo(pctRecurr, 50, 70, true);
  const recurrRows = recurrentes.slice(0,7).map(([k,d])=>{
    const flag = d.count>=3 ? `<span style="font-size:9px;background:var(--amber);color:#000;border-radius:3px;padding:1px 4px;margin-left:4px">ESTANDARIZAR</span>` : '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:11px;color:var(--txt)">"${k}…"${flag}</span>
      <span style="font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;color:var(--navy)">${d.count}× <span style="font-size:10px;font-weight:400;color:var(--muted)">${Math.round(d.hhReal*10)/10}h</span></span>
    </div>`;
  }).join('');
  const recurrInsight = recurrentes.length===0
    ? '✅ Sin tareas recurrentes detectadas en el período.'
    : estandarizar.length>0
    ? `🔁 ${estandarizar.length} tipo(s) de tarea aparecen 3+ veces → candidatos a estandarizar con checklist/plantilla. ${recurrentes.length} patrones recurrentes en total (${pctRecurr}% de bloques).`
    : `⚠️ ${recurrentes.length} tipos de tarea repetidos (${pctRecurr}% del total). Evalúa agrupar o crear plantillas.`;

  // Card helper con desglose por persona
  const kpiCardPers = (ico,titulo,valor,unidad,semIco,semCol,insight,persRows)=>`
  <div class="cw" style="border-left:4px solid ${semCol}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:18px">${ico}</span>
      <div style="flex:1">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">${titulo}</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-top:2px">
          <span style="font-family:Montserrat,sans-serif;font-size:26px;font-weight:800;color:${semCol}">${valor}</span>
          <span style="font-size:12px;color:var(--muted)">${unidad}</span>
          <span style="font-size:20px;margin-left:4px">${semIco}</span>
        </div>
      </div>
    </div>
    ${persRows?`<div style="padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${persRows}</div>`:''}
    <div style="font-size:11px;color:var(--txt);line-height:1.5">${insight}</div>
  </div>`;

  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px">
    ${eisCard}

    ${kpiCardPers('⚡','Express vs Simple',pctExpress+'%','bloques reactivos',
      semExpress.ico,semExpress.color,expressInsight,expressPers)}

    ${kpiCardPers('🔀','Fragmentación de Agenda',pctFrag+'%','bloques < 30 min (HH real)',
      semFrag.ico,semFrag.color,fragInsight,fragPers)}

    <!-- Ratio estimación -->
    <div class="cw" style="border-left:4px solid ${semRatio.color}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:18px">🎯</span>
        <div style="flex:1">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Ratio Estimación (Simple)</div>
          <div style="display:flex;align-items:baseline;gap:6px;margin-top:2px">
            <span style="font-family:Montserrat,sans-serif;font-size:26px;font-weight:800;color:${semRatio.color}">${ratioDisplay}</span>
            <span style="font-size:12px;color:var(--muted)">HH_Real / HH_Plan</span>
            <span style="font-size:20px;margin-left:4px">${semRatio.ico}</span>
          </div>
        </div>
      </div>
      ${ratioRows?`<div style="padding:4px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">${ratioRows}</div>`:''}
      <div style="font-size:11px;color:var(--txt);line-height:1.5">${ratioInsight}</div>
    </div>

    <!-- Carga por persona: card ancha -->
    <div class="cw" style="grid-column:1/-1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:18px">👤</span>
        <div class="ct" style="margin:0">Carga por Persona</div>
      </div>
      ${cargaRows||'<div class="emp">Sin datos</div>'}
      <div style="font-size:11px;color:var(--txt);line-height:1.5;padding-top:6px;border-top:1px solid var(--border);margin-top:8px">${cargaInsight}</div>
    </div>

    <!-- Demanda por área -->
    <div class="cw">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:18px">🏢</span>
        <div class="ct" style="margin:0">Demanda por Área</div>
      </div>
      ${areaRows||'<div class="emp">Sin datos</div>'}
      <div style="font-size:11px;color:var(--txt);line-height:1.5;padding-top:6px;border-top:1px solid var(--border);margin-top:8px">${demandaInsight}</div>
    </div>

    <!-- Tareas recurrentes -->
    <div class="cw" style="border-left:4px solid ${semRecurr.color}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:18px">🔁</span>
        <div style="flex:1">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Tareas Recurrentes</div>
          <div style="font-family:Montserrat,sans-serif;font-size:22px;font-weight:800;color:${semRecurr.color}">${recurrentes.length} <span style="font-size:12px;color:var(--muted);font-weight:400">patrones · ${estandarizar.length} para estandarizar</span></div>
        </div>
        <span style="font-size:20px">${semRecurr.ico}</span>
      </div>
      ${recurrRows||'<div class="emp">Sin patrones detectados</div>'}
      <div style="font-size:11px;color:var(--txt);line-height:1.5;padding-top:6px;border-top:1px solid var(--border);margin-top:8px">${recurrInsight}</div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════
// ANÁLISIS INTELIGENTE
// ══════════════════════════════════════════════════════════
function vDashAnalisis() {
  return `
  <div class="ph"><div class="pt"><div class="rb"></div>Análisis Inteligente</div>
    <div class="pd">Tendencias históricas, patrones operativos y anomalías en la base de tareas.</div></div>
  ${buildDashFilterBar('analisis')}
  <div id="dash-content-analisis"></div>`;
}

function buildDashAnalisis(f) {
  const hoy = todayStr();

  // ── Bloques filtrados por período y usuarios ──
  const blBase = BLOQUES.filter(b => {
    if (f.users.length>0 && !f.users.includes(b.responsable)) return false;
    const fd = b.fechaProg||b.fechaIngreso||'';
    if (f.desde && fd < f.desde) return false;
    if (f.hasta && fd > f.hasta) return false;
    return true;
  });

  if (blBase.length === 0) return `<div class="al w"><span class="al-ico">📭</span><div class="al-txt">No hay datos para el período y filtros seleccionados.</div></div>`;

  // ── Clasificar blBase usando reglas del Clasificador ──
  const _synA = {'mantención':'mantenimiento','mantener':'mantenimiento','mantencion':'mantenimiento',
    'revision':'revisión','revisar':'revisión','verificar':'revisión',
    'instalacion':'instalación','instalar':'instalación','cotizacion':'cotización',
    'programacion':'programación','adicional':'adicionales','plano':'planos'};
  const _normA = w => { const s=w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); return _synA[s]||s; };
  const _stopA = new Set(['de','la','el','en','y','a','los','del','las','un','una','con','por','para','al','se','que','es','no','lo','su','mas','para','por']);
  const _tokA  = t => (t||'').toLowerCase().split(/[\s,.\-\/\\()]+/).map(_normA).filter(w=>w.length>2&&!_stopA.has(w));

  const customRules = _cRules();
  const cExcl = _cExcl();
  const cNames = _cNames();
  const assignedA = new Set();
  const catGroupsA = {}; // key → {label, tasks, isCustom}

  // Layer 1: reglas personalizadas
  customRules.forEach(rule => {
    const key = 'rule_' + rule.id;
    const excluidos = new Set(cExcl[key] || []);
    const excKw = (rule.excludeKw || []).map(k => k.toLowerCase());
    blBase.forEach(b => {
      if (assignedA.has(b.id) || excluidos.has(b.id)) return;
      const t = (b.titulo||'').toLowerCase();
      if (excKw.some(ew => t.includes(ew))) return; // palabra de exclusión → no aplica
      if (rule.keywords.some(kw => t.includes(kw.toLowerCase()))) {
        if (!catGroupsA[key]) catGroupsA[key] = { label: rule.name, tasks: [], isCustom: true };
        catGroupsA[key].tasks.push(b);
        assignedA.add(b.id);
      }
    });
  });

  // Layer 2: bigramas automáticos para los no asignados
  const unassA = blBase.filter(b => !assignedA.has(b.id));
  if (unassA.length >= 3) {
    const ngCntA = {};
    unassA.forEach(b => {
      const ws = _tokA(b.titulo);
      for (let i=0;i<ws.length-1;i++) { const bg=ws[i]+' '+ws[i+1]; ngCntA[bg]=(ngCntA[bg]||0)+1; }
      ws.forEach(w=>{ if(w.length>4) ngCntA[w]=(ngCntA[w]||0)+1; });
    });
    Object.entries(ngCntA).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([ng])=>{
      unassA.forEach(b=>{
        if(assignedA.has(b.id)) return;
        if(_tokA(b.titulo).join(' ').includes(ng)){
          const lbl = cNames[ng] || (ng.charAt(0).toUpperCase()+ng.slice(1));
          if(!catGroupsA[ng]) catGroupsA[ng]={label:lbl, tasks:[], isCustom:false};
          catGroupsA[ng].tasks.push(b); assignedA.add(b.id);
        }
      });
    });
  }

  // Sin categoría
  const sinCatA = blBase.filter(b=>!assignedA.has(b.id));
  if (sinCatA.length>0) catGroupsA['__sin__']={label:'Sin categoría', tasks:sinCatA, isCustom:false};

  const catListA = Object.entries(catGroupsA)
    .map(([key,g])=>({key, label:g.label, tasks:g.tasks, isCustom:g.isCustom}))
    .sort((a,b)=>b.tasks.length-a.tasks.length);

  // ── Filtrar por categoría seleccionada ──
  const selCat = _analisisCat || 'todas';
  let bl = (selCat!=='todas' && catGroupsA[selCat]) ? catGroupsA[selCat].tasks : blBase;
  const selIds = selCat!=='todas' ? new Set(bl.map(b=>b.id)) : null;

  // ── Chips de categorías ──
  const chipsTodos = [{key:'todas', label:'Todas', n:blBase.length, isCustom:null}, ...catListA.map(c=>({...c, n:c.tasks.length}))];
  const chipsHtml = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px">
    ${chipsTodos.map(c=>{
      const active = selCat===c.key;
      const bg = active ? (c.isCustom===true?'#16a34a':c.key==='todas'?'var(--navy)':c.isCustom===false&&c.key!=='__sin__'?'#2563eb':'#64748b') : 'transparent';
      const border = active ? bg : 'var(--border)';
      const color = active ? 'white' : 'var(--txt)';
      return `<span onclick="setAnalisisCat('${c.key}')" style="cursor:pointer;padding:4px 12px;border-radius:14px;font-size:11px;border:1.5px solid ${border};background:${bg};color:${color};transition:all 0.15s">
        ${c.label} <span style="opacity:0.75;font-weight:400">${c.n}</span>
      </span>`;
    }).join('')}
  </div>`;

  const noData = bl.length===0;

  // ── 1: Tendencia semanal (últimas 12 semanas) ──
  const semanas = [];
  const baseD = new Date(hoy + 'T12:00:00');
  for (let i = 11; i >= 0; i--) {
    const d = new Date(baseD); d.setDate(baseD.getDate() - i*7);
    const dow = d.getDay();
    const mon = new Date(d); mon.setDate(d.getDate() + (dow===0?-6:1-dow));
    const sun = new Date(mon); sun.setDate(mon.getDate()+6);
    const monStr = dateStr(mon), sunStr = dateStr(sun);
    const bSem = BLOQUES.filter(b => {
      if (f.users.length>0 && !f.users.includes(b.responsable)) return false;
      if (selIds && !selIds.has(b.id)) return false;
      const fd = b.fechaReal||b.fechaProg||''; return fd>=monStr && fd<=sunStr;
    });
    const conf = bSem.filter(b=>b.estado==='Confirmado');
    semanas.push({ label: mon.toLocaleDateString('es-CL',{day:'numeric',month:'short'}),
      conf: conf.length, hh: conf.reduce((s,b)=>s+(parseFloat(b.hhReal)||0),0), total: bSem.length });
  }
  const maxHHSem = Math.max(...semanas.map(s=>s.hh), 1);
  const tendenciaRows = semanas.map((s,i) => {
    const w = Math.round(s.hh/maxHHSem*100);
    const isCurrent = i===semanas.length-1;
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
      <div style="width:50px;font-size:9px;color:var(--muted);text-align:right;flex-shrink:0">${s.label}</div>
      <div style="flex:1;height:14px;background:#f1f5f9;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${w}%;background:${isCurrent?'var(--navy)':'#60a5fa'};border-radius:3px"></div>
      </div>
      <div style="width:70px;font-size:10px;color:var(--navy);font-weight:700;text-align:right;flex-shrink:0">${Math.round(s.hh*10)/10}h &nbsp;<span style="color:var(--muted);font-weight:400">${s.conf}t</span></div>
    </div>`;
  }).join('');
  const ult4hh = semanas.slice(-4).reduce((s,w)=>s+w.hh,0);
  const ant4hh = semanas.slice(-8,-4).reduce((s,w)=>s+w.hh,0);
  const tendPct = ant4hh>0 ? Math.round((ult4hh-ant4hh)/ant4hh*100) : 0;
  const tendColor = tendPct>10?'var(--green)':tendPct<-10?'var(--red)':'var(--muted)';
  const tendTxt = tendPct>10 ? `📈 Carga +${tendPct}% vs las 4 semanas anteriores`
    : tendPct<-10 ? `📉 Carga ${tendPct}% vs las 4 semanas anteriores`
    : `➡️ Carga estable (${tendPct>0?'+':''}${tendPct}% vs semanas anteriores)`;
  const tendSuffix = selCat!=='todas' ? ` <span style="color:var(--muted)"> · categoría: ${catGroupsA[selCat]?.label||''}</span>` : '';

  // ── 2: Inventario total por estado ──
  const todosU = (selCat!=='todas' && catGroupsA[selCat]) ? catGroupsA[selCat].tasks
    : BLOQUES.filter(b => f.users.length===0||f.users.includes(b.responsable));
  const colEst = {'Por Iniciar':'#64748b','Programado':'#3b82f6','En Proceso':'#f59e0b','Standby':'#94a3b8','Confirmado':'#22c55e','Cancelado':'#ef4444'};
  const countEst = {};
  todosU.forEach(b => { countEst[b.estado]=(countEst[b.estado]||0)+1; });
  const totalEst = todosU.length||1;
  const estRows = ['Por Iniciar','Programado','En Proceso','Standby','Confirmado','Cancelado']
    .filter(e=>countEst[e]).map(e => {
      const pct = Math.round((countEst[e]||0)/totalEst*100);
      return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <div style="width:14px;height:14px;border-radius:3px;background:${colEst[e]};flex-shrink:0"></div>
        <div style="flex:1;font-size:11px;color:var(--txt)">${e}</div>
        <div style="width:90px;height:10px;background:#f1f5f9;border-radius:3px;overflow:hidden;flex-shrink:0">
          <div style="height:100%;width:${pct}%;background:${colEst[e]};border-radius:3px"></div>
        </div>
        <div style="width:60px;text-align:right;font-size:11px;font-weight:700;color:var(--navy);flex-shrink:0">${countEst[e]} <span style="color:var(--muted);font-weight:400">(${pct}%)</span></div>
      </div>`;
    }).join('');
  const activos = (countEst['Por Iniciar']||0)+(countEst['Programado']||0)+(countEst['En Proceso']||0);
  const pctConf = Math.round((countEst['Confirmado']||0)/totalEst*100);
  const inventInsight = `Activos: ${activos} · Confirmados: ${countEst['Confirmado']||0} (${pctConf}%) · Cancelados: ${countEst['Cancelado']||0}`;

  // ── 3: Carga por día de semana ──
  const diasN = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const cargaDia = [0,0,0,0,0,0,0], contDia = [0,0,0,0,0,0,0];
  bl.forEach(b => {
    const ds = b.fechaProg||b.fechaReal||''; if(!ds) return;
    const dow = new Date(ds+'T12:00:00').getDay();
    cargaDia[dow] += parseFloat(b.hhPlan)||parseFloat(b.hhReal)||0;
    contDia[dow]++;
  });
  const maxCargaDia = Math.max(...cargaDia, 1);
  const diaRows = [1,2,3,4,5,6,0].map(i => {
    const w = Math.round(cargaDia[i]/maxCargaDia*100);
    const isFinde = i===0||i===6;
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <div style="width:28px;font-size:10px;color:${isFinde?'var(--muted)':'var(--txt)'};font-weight:${isFinde?'400':'600'};flex-shrink:0">${diasN[i]}</div>
      <div style="flex:1;height:14px;background:#f1f5f9;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${w}%;background:${isFinde?'#94a3b8':'var(--navy)'};border-radius:3px"></div>
      </div>
      <div style="width:70px;font-size:10px;text-align:right;color:var(--navy);font-weight:700;flex-shrink:0">${Math.round(cargaDia[i]*10)/10}h <span style="color:var(--muted);font-weight:400">(${contDia[i]})</span></div>
    </div>`;
  }).join('');
  const diaMaxI = cargaDia.indexOf(Math.max(...cargaDia));
  const diaInsight = bl.length>0 ? `${diasN[diaMaxI]} es el día con mayor carga.${(cargaDia[0]+cargaDia[6])>0?` · ${Math.round((cargaDia[0]+cargaDia[6])*10)/10}h en fines de semana.`:''}` : 'Sin datos.';

  // ── 4: Tiempo de espera ingreso → ejecución ──
  const tiempos = bl.filter(b=>b.fechaIngreso&&(b.fechaProg||b.fechaReal)).map(b=>{
    return Math.round((new Date((b.fechaProg||b.fechaReal)+'T12:00:00')-new Date(b.fechaIngreso+'T12:00:00'))/86400000);
  }).filter(d=>d>=0&&d<365);
  const promEsp = tiempos.length>0?Math.round(tiempos.reduce((a,b)=>a+b,0)/tiempos.length):0;
  const mediana = tiempos.length>0?(()=>{const s=[...tiempos].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);})():0;
  const p90 = tiempos.length>0?(()=>{const s=[...tiempos].sort((a,b)=>a-b);return s[Math.floor(s.length*0.9)]||0;})():0;
  const p90Color = p90>14?'var(--red)':p90>7?'var(--amber)':'var(--green)';
  const esperaInsight = tiempos.length>0
    ? `${p90>14?'⚠️ El 10% tarda más de '+p90+' días.':p90>7?'Tiempo de respuesta moderado.':'✅ Respuesta rápida.'} Mediana ${mediana}d · Promedio ${promEsp}d.`
    : 'Sin suficientes datos de fechas para calcular tiempos.';

  // ── 5 (NUEVO): Distribución por Categorías ──
  const totalHHBase = blBase.reduce((s,b)=>s+(parseFloat(b.hhPlan)||0),0)||1;
  const catDistRows = catListA.length>0 ? catListA.map(c=>{
    const hhC = c.tasks.reduce((s,b)=>s+(parseFloat(b.hhPlan)||0),0);
    const pctC = Math.round(hhC/totalHHBase*100);
    const wC = Math.round(c.tasks.length/blBase.length*100);
    const isActive = selCat===c.key;
    const bgChip = c.isCustom?'#dcfce7':'#dbeafe';
    const colChip = c.isCustom?'#166534':'#1e40af';
    return `<div onclick="setAnalisisCat('${c.key}')" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:5px 8px;border-radius:6px;cursor:pointer;background:${isActive?'#f0f9ff':'transparent'};border:1px solid ${isActive?'var(--navy)':'transparent'}">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:10px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.label}</span>
          <span style="font-size:9px;padding:1px 5px;border-radius:8px;background:${bgChip};color:${colChip};white-space:nowrap">${c.isCustom?'regla':'auto'}</span>
        </div>
        <div style="height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin-top:3px">
          <div style="height:100%;width:${wC}%;background:${c.isCustom?'#16a34a':'#2563eb'};border-radius:3px"></div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:12px;font-weight:700;color:var(--navy)">${c.tasks.length} <span style="font-size:9px;color:var(--muted);font-weight:400">tareas</span></div>
        <div style="font-size:10px;color:var(--muted)">${Math.round(hhC*10)/10}h (${pctC}%)</div>
      </div>
    </div>`;
  }).join('') : '<div class="emp" style="font-size:11px">Sin categorías. Define reglas en el Clasificador de Tareas.</div>';

  // ── 6: Anomalías ──
  const blAnom = selIds
    ? BLOQUES.filter(b=>selIds.has(b.id)||(f.users.length===0||f.users.includes(b.responsable)))
    : BLOQUES.filter(b=>f.users.length===0||f.users.includes(b.responsable));
  const sinProgViejas = blAnom.filter(b=>{
    if(!['Por Iniciar','Standby'].includes(b.estado)) return false;
    if(selIds&&!selIds.has(b.id)) return false;
    if(!b.fechaIngreso) return false;
    return Math.round((new Date(hoy+'T12:00:00')-new Date(b.fechaIngreso+'T12:00:00'))/86400000)>30;
  }).sort((a,b)=>{
    const da=Math.round((new Date(hoy+'T12:00:00')-new Date(a.fechaIngreso+'T12:00:00'))/86400000);
    const db=Math.round((new Date(hoy+'T12:00:00')-new Date(b.fechaIngreso+'T12:00:00'))/86400000);
    return db-da;
  }).slice(0,8);

  const outliers = bl.filter(b=>{
    const p=parseFloat(b.hhPlan)||0, r=parseFloat(b.hhReal)||0;
    return p>0&&r>0&&r>2*p&&(r-p)>1;
  }).sort((a,b)=>(parseFloat(b.hhReal)||0)/(parseFloat(b.hhPlan)||1)-(parseFloat(a.hhReal)||0)/(parseFloat(a.hhPlan)||1)).slice(0,5);

  const anomRows = [
    ...sinProgViejas.map(b=>{
      const dias=Math.round((new Date(hoy+'T12:00:00')-new Date(b.fechaIngreso+'T12:00:00'))/86400000);
      return `<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:5px 6px"><span style="background:#fef3c7;color:#92400e;border-radius:3px;padding:1px 5px;font-size:9px;white-space:nowrap">⏳ SIN PROG</span></td>
        <td style="padding:5px 6px;font-size:11px">#${b.id} ${(b.titulo||'').substring(0,28)}${(b.titulo||'').length>28?'…':''}</td>
        <td style="padding:5px 6px;font-size:11px">${shortName(b.responsable||'')}</td>
        <td style="padding:5px 6px;font-size:11px;color:var(--red);font-weight:700;white-space:nowrap">${dias} días</td>
        <td style="padding:5px 6px"><button onclick="abrirModal(${b.id})" style="background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:10px;padding:2px 7px">Ver</button></td>
      </tr>`;
    }),
    ...outliers.map(b=>{
      const p=parseFloat(b.hhPlan)||0, r=parseFloat(b.hhReal)||0;
      const ratio=Math.round(r/p*10)/10;
      return `<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:5px 6px"><span style="background:#fee2e2;color:#991b1b;border-radius:3px;padding:1px 5px;font-size:9px;white-space:nowrap">📊 OUTLIER</span></td>
        <td style="padding:5px 6px;font-size:11px">#${b.id} ${(b.titulo||'').substring(0,28)}${(b.titulo||'').length>28?'…':''}</td>
        <td style="padding:5px 6px;font-size:11px">${shortName(b.responsable||'')}</td>
        <td style="padding:5px 6px;font-size:11px;color:var(--red);font-weight:700;white-space:nowrap">${ratio}x (${p}h→${r}h)</td>
        <td style="padding:5px 6px"><button onclick="abrirModal(${b.id})" style="background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:10px;padding:2px 7px">Ver</button></td>
      </tr>`;
    })
  ].join('');

  const selLabel = selCat!=='todas' && catGroupsA[selCat] ? ` <span style="color:var(--muted);font-size:11px;font-weight:400">· ${catGroupsA[selCat].label}</span>` : '';

  return `

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px">

    <div class="cw" style="grid-column:1/-1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span style="font-size:18px">📈</span>
        <div class="ct" style="margin:0">Tendencia — Últimas 12 Semanas (HH confirmadas)${selLabel}</div>
        <span style="font-size:11px;color:${tendColor};margin-left:auto">${tendTxt}</span>
      </div>
      ${tendenciaRows}
      <div style="font-size:10px;color:var(--muted);margin-top:8px">Barras = HH reales confirmadas · t = bloques confirmados · Azul oscuro = semana actual</div>
    </div>

    <!-- Inventario por estado -->
    <div class="cw">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:18px">🗂</span>
        <div class="ct" style="margin:0">Inventario por Estado${selLabel}</div>
      </div>
      ${estRows||'<div class="emp">Sin datos</div>'}
      <div style="font-size:11px;color:var(--txt);line-height:1.5;padding-top:8px;border-top:1px solid var(--border);margin-top:8px">${inventInsight}</div>
    </div>

    <!-- Distribución por Categorías -->
    <div class="cw">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:18px">🧩</span>
        <div class="ct" style="margin:0">Distribución por Categorías</div>
        <span style="font-size:10px;color:var(--muted);margin-left:auto">${catListA.length} categorías · click para filtrar</span>
      </div>
      ${catDistRows}
    </div>

    <!-- Patrones por día de semana -->
    <div class="cw">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:18px">📅</span>
        <div class="ct" style="margin:0">Carga por Día de Semana${selLabel}</div>
      </div>
      ${noData?'<div class="emp">Sin datos para esta categoría.</div>':diaRows}
      ${!noData?`<div style="font-size:11px;color:var(--txt);line-height:1.5;padding-top:8px;border-top:1px solid var(--border);margin-top:8px">${diaInsight}</div>`:''}
    </div>

    <!-- Tiempo de espera -->
    <div class="cw">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:18px">⏱</span>
        <div class="ct" style="margin:0">Tiempo Ingreso → Ejecución${selLabel}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
        <div style="text-align:center;padding:10px 6px;background:#f8fafc;border-radius:8px">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700">Mediana</div>
          <div style="font-family:Montserrat,sans-serif;font-size:24px;font-weight:800;color:var(--navy)">${mediana}</div>
          <div style="font-size:10px;color:var(--muted)">días</div>
        </div>
        <div style="text-align:center;padding:10px 6px;background:#f8fafc;border-radius:8px">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700">Promedio</div>
          <div style="font-family:Montserrat,sans-serif;font-size:24px;font-weight:800;color:var(--navy)">${promEsp}</div>
          <div style="font-size:10px;color:var(--muted)">días</div>
        </div>
        <div style="text-align:center;padding:10px 6px;background:#f8fafc;border-radius:8px">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700">P90</div>
          <div style="font-family:Montserrat,sans-serif;font-size:24px;font-weight:800;color:${p90Color}">${p90}</div>
          <div style="font-size:10px;color:var(--muted)">días</div>

      <div style="font-size:11px;color:var(--txt);line-height:1.5">${esperaInsight}</div>

    <!-- Anomalías -->

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:18px">🚨</span>
        <div class="ct" style="margin:0">Anomalías y Alertas${selLabel}</div>
        <span style="font-size:11px;color:var(--muted);margin-left:auto">${sinProgViejas.length} sin programar &gt;30d &nbsp;·&nbsp; ${outliers.length} outliers de duración</span>
      </div>
      ${anomRows
        ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">

        : '<div class="emp">✅ Sin anomalías detectadas en esta categoría.</div>'}
    </div>

}

let _capVista = 'hoy'; // 'hoy' | 'semana'

function renderCapacidadEquipo() {
  const el = document.getElementById('delgCapacidad');
  if (!el) return;
  const hoy = todayStr();
  const todayD = new Date(hoy+'T12:00:00');
  // Fechas de referencia
  const mananaD = new Date(todayD); mananaD.setDate(todayD.getDate()+1);
  const manana = dateStr(mananaD);
  const dow = todayD.getDay(); const daysToMon = dow===0?-6:1-dow;
  const lunes = new Date(todayD); lunes.setDate(todayD.getDate()+daysToMon);
  const semDates = Array.from({length:5},(_,i)=>{ const d=new Date(lunes); d.setDate(lunes.getDate()+i); return dateStr(d); });

  const team = PERSONAS.filter(p=>p!==SESSION.nombre);
  const colors = {'Luis Sanchez':'#2563eb','Luis Diaz':'#16a34a','Yamila Silva':'#9333ea'};

  // Helpers
  const getHH = (p, dates) => {
    let hh = 0;
    BLOQUES.filter(b=>b.responsable===p&&!['Standby','Cancelado'].includes(b.estado)).forEach(b=>{
      const fd = b.fechaProg||b.fechaReal||'';
      if(dates.includes(fd)) hh += parseFloat(b.hhPlan)||parseFloat(b.hhReal)||0;
    });
    return Math.round(hh*10)/10;
  };
  const getBlocks = (p, dates) => BLOQUES.filter(b=>b.responsable===p&&!['Standby','Cancelado'].includes(b.estado)&&dates.includes(b.fechaProg||b.fechaReal||''));

  const cards = team.map(p => {
    const col = colors[p]||'#637388';
    const capDia = 7, capSem = 35;

    // Datos según vista
    const hhHoy = getHH(p,[hoy]);
    const hhMan = getHH(p,[manana]);
    const hhSem = getHH(p,semDates);
    const bloqHoy = getBlocks(p,[hoy]);
    const bloqMan = getBlocks(p,[manana]);
    const backlog = BLOQUES.filter(b=>b.responsable===p&&b.estado==='Por Iniciar'&&!b.fechaProg).length;
    const delegPend = BLOQUES.filter(b=>b.responsable===p&&b.creadoPor&&b.creadoPor!==p&&!['Confirmado','Cancelado'].includes(b.estado)).length;

    const pctHoy = Math.min(Math.round(hhHoy/capDia*100),100);
    const pctMan = Math.min(Math.round(hhMan/capDia*100),100);
    const pctSem = Math.min(Math.round(hhSem/capSem*100),100);
    const barC = (pct) => pct>=85?'#dc2626':pct>=65?'#d97706':'#16a34a';

    const barRow = (label, hh, cap, pct) => `
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:2px">
          <span style="font-size:10px;font-weight:600;color:var(--txt)">${label}</span>
          <span style="font-size:10px;color:${barC(pct)};font-weight:700">${hh}h / ${cap}h est. (${pct}%)</span>
        </div>
        <div style="height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${barC(pct)};border-radius:4px;transition:width .3s"></div>
        </div>
        ${pct<50?`<div style="font-size:9px;color:#16a34a;margin-top:1px">✓ Tiene espacio — ${cap-hh}h disponibles</div>`
          :pct>=85?`<div style="font-size:9px;color:#dc2626;margin-top:1px">⚠️ Muy ocupado — solo ${Math.max(cap-hh,0)}h libres</div>`:''}
      </div>`;

    // Mini lista de bloques del día
    const listaBloqs = (bloqs) => bloqs.length ? bloqs.slice(0,3).map(b=>
      `<div style="font-size:9px;color:#475569;padding:1px 0">· ${(b.titulo||'').substring(0,35)}${b.titulo?.length>35?'…':''} <span style="color:var(--muted)">(${parseFloat(b.hhPlan)||0}h)</span></div>`
    ).join('') + (bloqs.length>3?`<div style="font-size:9px;color:var(--muted)">+ ${bloqs.length-3} más...</div>`:'') : `<div style="font-size:9px;color:var(--muted)">Sin bloques programados</div>`;

    return `<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;flex:1;min-width:200px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
        <div style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0"></div>
        <span style="font-size:12px;font-weight:700;color:var(--navy)">${p.split(' ')[0]} ${p.split(' ')[1]?.charAt(0)||''}</span>
        ${delegPend>0?`<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:#ede9fe;color:#7c3aed;font-weight:700">👔 ${delegPend}</span>`:''}
        <button onclick="agFilterPerson('${p}');goSub('A','agenda')" style="margin-left:auto;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:10px;cursor:pointer">📅 Ver</button>
      </div>
      ${barRow('Hoy',hhHoy,capDia,pctHoy)}
      ${barRow('Mañana',hhMan,capDia,pctMan)}
      ${barRow('Esta semana',hhSem,capSem,pctSem)}
      <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
        <div style="font-size:9px;font-weight:700;color:var(--muted);margin-bottom:3px">BLOQUES DE HOY</div>
        ${listaBloqs(bloqHoy)}
      </div>
      <div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px">
        <div style="font-size:9px;font-weight:700;color:var(--muted);margin-bottom:3px">BLOQUES DE MAÑANA</div>
        ${listaBloqs(bloqMan)}
      </div>
      <div style="margin-top:6px;font-size:10px;color:#d97706">${backlog>0?`📥 ${backlog} bloque${backlog!==1?'s':''} en cola sin programar`:''}</div>
    </div>`;
  }).join('');

  el.innerHTML = `<div style="margin-bottom:4px">
    <div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:8px">⚡ Capacidad del equipo</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${cards}</div>
    <div style="font-size:9px;color:var(--muted);margin-top:6px">Capacidad estimada: 7h/día · 35h/semana · Programado incluye bloques Por Iniciar con fecha asignada</div>
  </div>`;
}

function renderDelegados() {
  renderCapacidadEquipo();
  const el = document.getElementById('delgContent');
  if (!el) return;
  const hoy = todayStr();
  const filtroP = document.getElementById('delgFiltroP')?.value || '';
  const filtroE = document.getElementById('delgFiltroE')?.value || '';

  // Bloques delegados: creadoPor = admin y responsable ≠ admin
  let delegados = BLOQUES.filter(b => b.creadoPor && b.creadoPor !== b.responsable);
  if (filtroP) delegados = delegados.filter(b => b.responsable === filtroP);

  // Clasificar por urgencia de deadline
  const _dias = b => b.fechaLimite
    ? Math.round((new Date(b.fechaLimite+'T23:59:00') - new Date(hoy+'T00:00:00')) / 86400000)
    : null;

  const _cat = b => {
    const d = _dias(b);
    if (b.estado === 'Confirmado' || b.estado === 'Cancelado') return 'cerrado';
    if (d !== null && d < 0) return 'vencido';
    if (d !== null && d <= 1) return 'hoy';
    if (b.estado === 'Por Iniciar') return 'sinprog';
    return 'activo';
  };

  if (filtroE) delegados = delegados.filter(b => {
    const cat = _cat(b);
    if (filtroE === 'vencido') return cat === 'vencido';
    if (filtroE === 'hoy') return cat === 'hoy';
    if (filtroE === 'activo') return cat === 'activo';
    if (filtroE === 'Por Iniciar') return cat === 'sinprog';
    return true;
  });

  delegados = delegados.sort((a,b) => {
    const order = {vencido:0,hoy:1,activo:2,sinprog:3,cerrado:4};
    return (order[_cat(a)]||5) - (order[_cat(b)]||5);
  });

  const cntEl = document.getElementById('delgContador');
  if (cntEl) cntEl.textContent = `${delegados.length} bloque${delegados.length!==1?'s':''}`;

  if (!delegados.length) {
    el.innerHTML = '<div class="al info"><span class="al-ico">📭</span><div class="al-txt">No hay bloques delegados que coincidan con el filtro.</div></div>';
    return;
  }

  const catConf = {
    vencido: {label:'⚠️ Vencidos sin completar', bg:'#fef2f2', border:'#fca5a5', txtColor:'#991b1b'},
    hoy:     {label:'🔴 Vencen hoy o mañana',    bg:'#fff7ed', border:'#fed7aa', txtColor:'#9a3412'},
    activo:  {label:'🟡 En curso',                bg:'#fefce8', border:'#fde68a', txtColor:'#854d0e'},
    sinprog: {label:'📥 Sin programar',           bg:'#f0f9ff', border:'#bae6fd', txtColor:'#075985'},
    cerrado: {label:'✅ Completados / Cancelados', bg:'#f0fdf4', border:'#bbf7d0', txtColor:'#166534'},
  };

  // Agrupar
  const grupos = {};
  delegados.forEach(b => { const c=_cat(b); if(!grupos[c])grupos[c]=[]; grupos[c].push(b); });
  const catOrder = ['vencido','hoy','activo','sinprog','cerrado'];

  el.innerHTML = catOrder.filter(c=>grupos[c]).map(c => {
    const conf = catConf[c];
    const items = grupos[c].map(b => {
      const dias = _dias(b);
      const dlTxt = dias===null ? '—' : dias<0 ? `Venció hace ${Math.abs(dias)} días` : dias===0 ? 'Hoy' : dias===1 ? 'Mañana' : `${b.fechaLimite}`;
      const dlColor = dias!==null && dias<0 ? '#dc2626' : dias===0||dias===1 ? '#ea580c' : '#64748b';
      const estadoColors = {'Por Iniciar':'#64748b','Programado':'#2563eb','En Proceso':'#d97706','Confirmado':'#16a34a','Standby':'#7c3aed','Cancelado':'#dc2626'};
      const eColor = estadoColors[b.estado] || '#64748b';
      const eisLabel = b.urgente==='Si'&&b.importante==='Si'?'🔴 P1':b.urgente==='Si'?'🟠 P2':b.importante==='Si'?'🟡 P3':'⚪ P4';
      return `<div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
              <span style="font-size:10px;color:var(--muted)">#${b.id}</span>
              <span style="font-size:12px;font-weight:700;color:var(--navy)">${(b.titulo||'').length>50?(b.titulo||'').substring(0,50)+'…':b.titulo||'Sin título'}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">
              <span style="font-size:10px;padding:1px 7px;border-radius:8px;background:${eColor}22;color:${eColor};font-weight:700">${b.estado}</span>
              <span style="font-size:10px;color:var(--muted)">→ ${shortName(b.responsable||'')}</span>
              <span style="font-size:10px;color:var(--muted)">${eisLabel}</span>
              ${b.hhPlan?`<span style="font-size:10px;color:var(--muted)">${b.hhPlan}h plan</span>`:''}
              ${dias!==null?`<span style="font-size:10px;color:${dlColor};font-weight:700">📅 ${dlTxt}</span>`:'<span style="font-size:10px;color:var(--muted)">Sin deadline</span>'}
            </div>
            ${b.instrucciones?`<div style="font-size:10px;color:#475569;margin-top:4px;padding:4px 6px;background:#f8fafc;border-radius:4px;border-left:2px solid #94a3b8">📝 ${b.instrucciones.length>80?b.instrucciones.substring(0,80)+'…':b.instrucciones}</div>`:''}
          </div>
          <button onclick="abrirModal(${b.id})" style="flex-shrink:0;padding:4px 10px;border:1px solid var(--border);border-radius:5px;background:#fff;font-size:10px;cursor:pointer">Ver</button>
        </div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;margin-bottom:6px;background:${conf.bg};color:${conf.txtColor};border:1px solid ${conf.border}">${conf.label} — ${grupos[c].length} bloque${grupos[c].length!==1?'s':''}</div>
      ${items}
    </div>`;
  }).join('');
}

function _saveTmpl(t){ localStorage.setItem(_TMPL_KEY, JSON.stringify(t)); }

function abrirPlantillas() {
  const tmpls = _getTmpl();
  const otrosOpts = PERSONAS.filter(p=>p!==SESSION.nombre).map(p=>`<option value="${p}">${p}</option>`).join('');
  const meOpt = `<option value="${SESSION.nombre}">${SESSION.nombre} (yo)</option>`;
  const listaHtml = tmpls.length ? tmpls.map((t,i) => `
    <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px">

    <div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px">📋 Plantillas de Bloques</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Reutiliza bloques frecuentes sin volver a escribir los datos. Clic en "Usar" para pre-llenar el formulario.</div>
    ${listaHtml}

      <div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:10px">Nueva plantilla</div>

          <select id="tmplResp"><option value="${SESSION.nombre}">${SESSION.nombre} (yo)</option>${otrosOpts}</select></div>
        <div class="fi"><label class="rq">HH planificadas</label>
          <input type="number" id="tmplHH" step="0.25" min="0.25" placeholder="Ej: 2"></div>
        <div class="fi"><label>Área</label>
          ${ac('Area','tmplArea','Opcional','style="width:100%"')}</div>

          <select id="tmplUrg"><option value="No">No</option><option value="Si">Sí</option></select>
        </div>
        <div class="fi">
          <label>¿Importante?</label>
          <select id="tmplImp"><option value="No">No</option><option value="Si">Sí</option></select>
        </div>
        <div class="fi fw" style="grid-column:1/-1"><label>Instrucciones (opcional)</label>
          <textarea id="tmplInstr" placeholder="Contexto o instrucciones predeterminadas" rows="2" style="resize:vertical"></textarea></div>
      </div>
      <button onclick="guardarPlantilla()" style="margin-top:10px;padding:7px 18px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;width:100%">💾 Guardar plantilla</button>
    </div>
  </div>`);
}

function guardarPlantilla() {
  const nom = document.getElementById('tmplNom')?.value?.trim();
  const hhp = parseFloat(document.getElementById('tmplHH')?.value);
  if (!nom) { toast('Ingresa un nombre para la plantilla','warn'); return; }
  if (!hhp || hhp<=0) { toast('Ingresa las horas planificadas','warn'); return; }
  const t = {
    nombre: nom,
    responsable: document.getElementById('tmplResp')?.value || SESSION.nombre,
    hhPlan: hhp,
    area: document.getElementById('tmplArea')?.value?.trim() || '',
    tipoBloque: document.getElementById('tmplTipo')?.value || '',
    urgente: document.getElementById('tmplUrg')?.value || 'No',
    importante: document.getElementById('tmplImp')?.value || 'No',
    instrucciones: document.getElementById('tmplInstr')?.value?.trim() || '',
  };
  const tmpls = _getTmpl(); tmpls.push(t); _saveTmpl(tmpls);
  toast('✅ Plantilla guardada','ok'); abrirPlantillas();
}

function eliminarPlantilla(i) {
  const tmpls = _getTmpl(); tmpls.splice(i,1); _saveTmpl(tmpls); abrirPlantillas();
}

function usarPlantilla(i) {
  const t = _getTmpl()[i]; if(!t) return;
  closeModal();
  // Ir a nuevo bloque y pre-rellenar
  goSub('A','nuevoBloque');
  setTimeout(() => {
    // Activar modo según responsable
    const isDelegar = t.responsable !== SESSION.nombre && activeRol()==='admin';
    if (isDelegar) setNBMode('delegar');
    // Seleccionar tipo Simple
    document.getElementById('ttS')?.click();
    // Pre-rellenar campos
    setTimeout(() => {
      if (isDelegar) {
        const sel = document.getElementById('nbRespSel');
        if (sel) sel.value = t.responsable;
      }
      const areEl = document.getElementById('nbAre'); if (areEl) areEl.value = t.area || '';
      const tipEl = document.getElementById('nbTip'); if (tipEl) tipEl.value = t.tipoBloque || '';
      const hhEl  = document.getElementById('nbHHp'); if (hhEl)  hhEl.value = t.hhPlan || '';
      const inEl  = document.getElementById('nbInstrucciones'); if (inEl) inEl.value = t.instrucciones || '';
      // Eisenhower
      setNBEis('u', t.urgente==='Si');
      setNBEis('i', t.importante==='Si');
      toast(`📋 Plantilla "${t.nombre}" aplicada`,'ok');
    }, 150);
  }, 100);
}

// ── Análisis Inteligente — categoría activa ──
let _analisisCat = 'todas';

  applyDashFilter('analisis');
}

// ── Persistencia ──
const _CN = 'ot_clasif_names', _CE = 'ot_clasif_excl', _CR = 'ot_clasif_rules';
function _cNames() { try{return JSON.parse(localStorage.getItem(_CN)||'{}')}catch(e){return{}} }
function _cExcl()  { try{return JSON.parse(localStorage.getItem(_CE)||'{}')}catch(e){return{}} }
function _cRules() { try{return JSON.parse(localStorage.getItem(_CR)||'[]')}catch(e){return[]} }
function _saveRules(r){ localStorage.setItem(_CR, JSON.stringify(r)); }

// ── Funciones interactivas ──
function renameClasif(key) {
  const m=_cNames(), cur=m[key]||key;
  const n=window.prompt('Renombrar categoría como:', cur);
  if(n&&n.trim()&&n.trim()!==cur){m[key]=n.trim();localStorage.setItem(_CN,JSON.stringify(m));applyDashFilter('clasif');}
}
function excluirDeClasif(key, id) {
  const m=_cExcl(); if(!m[key])m[key]=[];
  if(!m[key].includes(id))m[key].push(id);
  localStorage.setItem(_CE,JSON.stringify(m)); applyDashFilter('clasif'); toast('Tarea excluida','ok');
}
function incluirEnClasif(key, id) {
  const m=_cExcl(); if(m[key])m[key]=m[key].filter(x=>x!==id);
  localStorage.setItem(_CE,JSON.stringify(m)); applyDashFilter('clasif'); toast('Tarea incluida de nuevo','ok');
}
function toggleClasifDetail(key) {
  const d=document.getElementById('det-'+key), b=document.getElementById('btn-'+key); if(!d)return;
  const open=d.style.display!=='none'; d.style.display=open?'none':'block';
  if(b)b.innerHTML=open?'&#9660; Ver tareas':'&#9650; Ocultar tareas';
}

// ── Gestión de reglas personalizadas ──
function abrirReglasClasif() {
  const rules=_cRules();
  const swSug=new Set(['de','la','el','en','y','a','los','del','las','un','una','con','por','para','al','se','que','es','no','lo','su','más']);
  const fq={};
  BLOQUES.forEach(b=>{
    const words=(b.titulo||'').toLowerCase().replace(/[^\w\sáéíóúñ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!swSug.has(w));
    for(let i=0;i<words.length-1;i++){const ng=words[i]+' '+words[i+1];fq[ng]=(fq[ng]||0)+1;}
    words.filter(w=>w.length>=5).forEach(w=>{fq[w]=(fq[w]||0)+1;});
  });
  const allKw=rules.flatMap(r=>r.keywords);
  const sugs=Object.entries(fq)
    .filter(([ng,n])=>n>=3&&!allKw.some(k=>ng.includes(k)||k.includes(ng)))
    .sort((a,b)=>b[1]-a[1]).slice(0,10);

  const btnSm='background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:2px 6px;font-size:11px;color:var(--muted);line-height:1.4';
  const rulesHtml=rules.length?rules.map((r,idx)=>{
    const excKws=(r.excludeKw||[]);
    const canUp=idx>0, canDown=idx<rules.length-1;
    return `
    <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff">
      <!-- Header -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="display:flex;flex-direction:column;gap:2px">
            <button onclick="clasifMoveRule('${r.id}',-1)" ${canUp?'':'disabled'} style="${btnSm};${canUp?'':'opacity:.35;cursor:default'}">▲</button>
            <button onclick="clasifMoveRule('${r.id}',1)"  ${canDown?'':'disabled'} style="${btnSm};${canDown?'':'opacity:.35;cursor:default'}">▼</button>
          </div>
          <span style="font-size:10px;color:var(--muted);width:16px;text-align:center;font-weight:700">${idx+1}</span>
          <strong style="font-size:13px;color:var(--navy)">${r.name}</strong>
        </div>
        <button onclick="clasifDelRule('${r.id}')" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1">×</button>
      </div>
      <!-- Incluir si contiene -->
      <div style="font-size:10px;font-weight:700;color:#3730a3;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">✅ Incluir si contiene</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:22px">
        ${r.keywords.map(kw=>`<span style="background:#e0e7ff;color:#3730a3;border-radius:4px;padding:2px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px">${kw}
          <button onclick="clasifDelKw('${r.id}','${kw.replace(/'/g,"\\'")}')" style="background:none;border:none;cursor:pointer;color:#6366f1;font-size:14px;padding:0;line-height:1">×</button></span>`).join('')}
        ${!r.keywords.length?'<span style="font-size:10px;color:var(--muted)">Sin palabras aún</span>':''}
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <input id="kwi-${r.id}" placeholder="agregar incluir..." style="flex:1;padding:5px 9px;border:1px solid var(--border);border-radius:5px;font-size:11px">
        <button onclick="clasifAddKw('${r.id}')" style="padding:5px 12px;background:var(--navy);color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer">+</button>
      </div>
      <!-- Excluir si contiene -->
      <div style="font-size:10px;font-weight:700;color:#991b1b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">🚫 Excluir si contiene</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:22px">
        ${excKws.map(kw=>`<span style="background:#fee2e2;color:#991b1b;border-radius:4px;padding:2px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px">${kw}
          <button onclick="clasifDelExcKw('${r.id}','${kw.replace(/'/g,"\\'")}')" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:14px;padding:0;line-height:1">×</button></span>`).join('')}
        ${!excKws.length?'<span style="font-size:10px;color:var(--muted)">Ninguna</span>':''}
      </div>
      <div style="display:flex;gap:6px">
        <input id="exki-${r.id}" placeholder="agregar excluir..." style="flex:1;padding:5px 9px;border:1px solid #fecaca;border-radius:5px;font-size:11px">
        <button onclick="clasifAddExcKw('${r.id}')" style="padding:5px 12px;background:#dc2626;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer">+</button>
      </div>
    </div>`;
  }).join('')
  :'<div style="font-size:12px;color:var(--muted);margin-bottom:12px;padding:10px;background:#f8fafc;border-radius:6px">Aún no tienes categorías personalizadas. Crea la primera abajo.</div>';

  const sugHtml=sugs.length?`
    <div style="margin-top:14px;padding:12px;background:#f0f9ff;border-radius:8px;border:1px solid #bae6fd">
      <div style="font-size:11px;font-weight:700;color:#0369a1;margin-bottom:8px">💡 Patrones frecuentes sin categoría — clic para crear</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${sugs.map(([ng,n])=>`<button onclick="clasifQuickAdd('${ng.replace(/'/g,"\\'")}','${ng.replace(/'/g,"\\'")}');event.stopPropagation()"
          style="background:#fff;border:1px solid #7dd3fc;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;color:#0369a1">
          "${ng}" <span style="color:#94a3b8">${n}×</span></button>`).join('')}
      </div>
    </div>`:'';

  openModal(`<div>
    <div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px">⚙ Gestionar Categorías</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.6">Las categorías se evalúan <strong>en orden</strong> (▲▼ para cambiar prioridad). Una tarea queda en la primera categoría cuyas palabras de inclusión aparezcan en el título <em>y</em> ninguna de exclusión esté presente.</div>

    <!-- Buscador de sondeo -->
    <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px">🔍 Sondear palabra — ver qué tareas la contienen</div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <input id="clasifSondeo" placeholder="Escribe una palabra o frase..." oninput="clasifBuscador(this.value)"
          style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px">
      </div>
      <div id="clasifBuscResult" style="max-height:160px;overflow-y:auto;font-size:11px"></div>
    </div>

    ${rulesHtml}
    <div style="border-top:2px solid var(--border);padding-top:14px;margin-top:6px">
      <div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px">Nueva categoría</div>
      <input id="newRName" placeholder="Nombre (ej: Presupuesto / Costeo)" style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:8px">
      <div style="display:flex;gap:8px">
        <input id="newRKw" placeholder="Palabras clave separadas por coma (ej: cotización, costeo, presupuesto)" style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px">
        <button onclick="clasifAddRule()" style="padding:7px 16px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap">Crear</button>
      </div>
    </div>
    ${sugHtml}
  </div>`);
}

function clasifAddRule() {
  const name=(document.getElementById('newRName')?.value||'').trim();
  const kwRaw=(document.getElementById('newRKw')?.value||'').trim();
  if(!name){toast('Ingresa un nombre para la categoría','warn');return;}
  const kws=kwRaw?kwRaw.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean):[];
  const rules=_cRules(); rules.push({id:Date.now()+'',name,keywords:kws});

function buildDashClasif(f) {
  const hoy = todayStr();
  const cNames = _cNames(), cExcl = _cExcl(), customRules = _cRules();

  // ── Filtrar bloques del período ──
  const bl = BLOQUES.filter(b => {
    if (f.users.length > 0 && !f.users.includes(b.responsable)) return false;
    const fd = b.fechaProg || b.fechaIngreso || '';
    if (f.desde && fd < f.desde) return false;
    if (f.hasta && fd > f.hasta) return false;
    return true;
  });
  if (bl.length < 5) return `<div class="al w"><span class="al-ico">📭</span>
    <div class="al-txt">Se necesitan al menos 5 tareas en el período para clasificar. Amplía el rango de fechas.</div></div>`;

  // ── Stopwords + sinónimos → normalización de conceptos ──
  const SW = new Set(['de','la','el','en','y','a','los','del','las','un','una','con','por','para','al','se','que','es','no','lo','su','sus','más','e','o','u','i','le','les','me','mi','te','tu','nos','si','sin','pero','como','hay','bien','así','este','esta','estos','estas','ese','esa','cuando','donde','quien','cual','también','solo','ya','ser','está','son','fue','han','ha','era','van','ir','ver','hacer','tener','debe','puede','todo','del','las']);
  const SYN = {
    'mantención':'mantenimiento','mantener':'mantenimiento','mantencion':'mantenimiento',
    'revision':'revisión','revisar':'revisión','verificar':'revisión','verificacion':'revisión',
    'instalacion':'instalación','instalar':'instalación',
    'capacitacion':'capacitación','training':'capacitación',
    'informe':'reporte','report':'reporte',
    'reunion':'reunión','meeting':'reunión','junta':'reunión',
    'soporte':'soporte','apoyo':'soporte','asistencia':'soporte',
    'configuracion':'configuración','configurar':'configuración',
    'actualizacion':'actualización','actualizar':'actualización',
    'diagnostico':'diagnóstico','diagnosticar':'diagnóstico',
    'reparacion':'reparación','reparar':'reparación',
    'limpieza':'limpieza','limpiar':'limpieza',
    'inspeccion':'inspección','inspeccionar':'inspección',
  };
  function normalizeWord(w) { return SYN[w] || w; }

  // ── Extraer tokens normalizados de un título ──
  function tokenize(titulo) {
    return (titulo || '').toLowerCase()
      .replace(/[^\w\sáéíóúüñ]/g, ' ')
      .split(/\s+/)
      .map(normalizeWord)
      .filter(w => w.length > 2 && !SW.has(w));
  }

  // ── Construir n-gramas (tri → bi → uni) ──
  function ngrams(titulo) {
    const words = tokenize(titulo);
    const out = new Set();
    for (let i = 0; i < words.length - 2; i++) out.add(words.slice(i,i+3).join(' '));
    for (let i = 0; i < words.length - 1; i++) out.add(words.slice(i,i+2).join(' '));
    words.filter(w => w.length >= 5).forEach(w => out.add(w));
    return [...out];
  }

  // ── Frecuencia de n-gramas ──
  const freq = {};
  bl.forEach(b => { ngrams(b.titulo).forEach(ng => { freq[ng] = (freq[ng]||0)+1; }); });

  // ── Candidatos: umbral dinámico ──
  const minFreq = Math.max(2, Math.floor(bl.length * 0.04));
  let candidates = Object.entries(freq)
    .filter(([,n]) => n >= minFreq)
    .sort((a,b) => { const d=b[0].split(' ').length-a[0].split(' ').length; return d!==0?d:b[1]-a[1]; })
    .map(([ng]) => ng);

  // ── Fusión de conceptos: si dos candidatos comparten ≥70% de tareas, unir bajo el más largo ──
  const taskSets = {};
  candidates.forEach(ng => {
    taskSets[ng] = new Set(bl.filter(b=>(b.titulo||'').toLowerCase().includes(ng)).map(b=>b.id));
  });
  const merged = new Set();
  candidates.forEach((a,i) => {
    if (merged.has(a)) return;
    candidates.slice(i+1).forEach(b => {
      if (merged.has(b)) return;
      const sa=taskSets[a], sb=taskSets[b];
      const inter=[...sa].filter(id=>sb.has(id)).length;
      const smaller=Math.min(sa.size,sb.size);
      if (smaller>0 && inter/smaller >= 0.75) {
        // absorber el más corto / menos frecuente en el otro
        const absorbB = a.split(' ').length >= b.split(' ').length;
        merged.add(absorbB ? b : a);
      }
    });
  });
  candidates = candidates.filter(ng => !merged.has(ng));

  // ── 1. Categorías personalizadas tienen prioridad ──
  const groups = {}, assigned = new Set();
  // Clave de grupo para reglas custom: 'rule_' + id
  customRules.forEach(rule => {
    const key = 'rule_' + rule.id;
    const excluidos = new Set(cExcl[key] || []);
    const excKw = (rule.excludeKw || []).map(k => k.toLowerCase());
    bl.forEach(b => {
      if (assigned.has(b.id) || excluidos.has(b.id)) return;
      const t = (b.titulo||'').toLowerCase();
      if (excKw.some(ew => t.includes(ew))) return; // palabra de exclusión → no aplica
      if (rule.keywords.some(kw => t.includes(kw.toLowerCase()))) {
        if (!groups[key]) groups[key] = { label: rule.name, tasks: [], isCustom: true };
        groups[key].tasks.push(b);
        assigned.add(b.id);
      }
    });
  });

  // ── 2. Auto-detección para tareas no clasificadas aún ──
  candidates.forEach(ng => {
    const excluidos = new Set(cExcl[ng] || []);
    bl.forEach(b => {
      if (assigned.has(b.id) || excluidos.has(b.id)) return;
      if ((b.titulo||'').toLowerCase().includes(ng)) {
        if (!groups[ng]) groups[ng] = { label: cNames[ng] || ng, tasks: [], isCustom: false };
        groups[ng].tasks.push(b);
        assigned.add(b.id);
      }
    });
  });
  const sinClasif = bl.filter(b => !assigned.has(b.id));

  // ── Estadísticas de un grupo ──
  function calcSt(tasks) {
    const conP=tasks.filter(b=>parseFloat(b.hhPlan)>0);
    const conR=tasks.filter(b=>parseFloat(b.hhReal)>0);
    const conAmbos=tasks.filter(b=>parseFloat(b.hhPlan)>0&&parseFloat(b.hhReal)>0);
    const totalHHP=tasks.reduce((s,b)=>s+(parseFloat(b.hhPlan)||0),0);
    const totalHHR=tasks.reduce((s,b)=>s+(parseFloat(b.hhReal)||0),0);
    const avgHHP=conP.length?totalHHP/conP.length:0;
    const avgHHR=conR.length?totalHHR/conR.length:0;
    const ratio=conAmbos.length?conAmbos.reduce((s,b)=>s+(parseFloat(b.hhReal)||0)/(parseFloat(b.hhPlan)||1),0)/conAmbos.length:null;
    let cv=null;
    if(conP.length>=3){
      const vals=conP.map(b=>parseFloat(b.hhPlan)||0);
      const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
      const sd=Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length);
      cv=mean>0?sd/mean:null;
    }
    const byPerson={};
    tasks.forEach(b=>{byPerson[b.responsable||'?']=(byPerson[b.responsable||'?']||0)+1;});
    const base=new Date(hoy+'T12:00:00');
    let ult4=0,ant4=0;
    tasks.forEach(b=>{
      const fd=b.fechaProg||b.fechaReal||''; if(!fd)return;
      const d=Math.round((base-new Date(fd+'T12:00:00'))/86400000);
      if(d>=0&&d<28)ult4++; else if(d>=28&&d<56)ant4++;
    });
    const trendPct=ant4>0?Math.round((ult4-ant4)/ant4*100):(ult4>0?100:null);
    const conf=tasks.filter(b=>b.estado==='Confirmado').length;
    const sinProg=tasks.filter(b=>['Por Iniciar','Standby'].includes(b.estado)).length;
    return {
      n:tasks.length,
      totalHHP:Math.round(totalHHP*10)/10, totalHHR:Math.round(totalHHR*10)/10,
      avgHHP:Math.round(avgHHP*10)/10,     avgHHR:Math.round(avgHHR*10)/10,
      ratio:ratio?Math.round(ratio*100)/100:null,
      cv:cv?Math.round(cv*100)/100:null,
      byPerson, conf, sinProg, trendPct
    };
  }

  // ── Lista de grupos + términos relacionados ──
  const groupList = Object.entries(groups).map(([key, g]) => {
    const tasks = g.tasks, isCustom = g.isCustom, label = g.label;
    const related = !isCustom
      ? candidates.filter(c=>c!==key && tasks.filter(b=>(b.titulo||'').toLowerCase().includes(c)).length >= Math.ceil(tasks.length*0.3)).slice(0,4)
      : [];
    return { key, label, tasks, st: calcSt(tasks), related, isCustom };
  }).sort((a,b) => b.st.totalHHP - a.st.totalHHP);

  if (groupList.length === 0) return `<div class="al w"><span class="al-ico">🔍</span>
    <div class="al-txt">No se detectaron patrones con el período seleccionado. Amplía el rango de fechas o ajusta los filtros.</div></div>`;

  const globalHHP = bl.reduce((s,b)=>s+(parseFloat(b.hhPlan)||0),0);
  const pctClasif = bl.length ? Math.round((bl.length-sinClasif.length)/bl.length*100) : 0;

  // ── Alertas ──
  const aBg={warn:'#fef3c7',danger:'#fee2e2',info:'#eff6ff'};
  const aTx={warn:'#78350f',danger:'#991b1b',info:'#1e3a8a'};
  function getAlerts(st) {
    const a=[];
    if(st.ratio!==null&&st.ratio>1.3)
      a.push({lvl:'warn',txt:`Subestimación crónica +${Math.round((st.ratio-1)*100)}% — ajustar HHP referencia de ${st.avgHHP}h → ~${Math.round(st.avgHHP*st.ratio*10)/10}h`});
    if(st.ratio!==null&&st.ratio<0.7)
      a.push({lvl:'info',txt:`Sobreestimación ${Math.round((1-st.ratio)*100)}% — reducir HHP estimado`});
    if(st.cv!==null&&st.cv>0.6)
      a.push({lvl:'warn',txt:`Alta variabilidad (CV=${st.cv}) — tareas impredecibles, evaluar estandarizar proceso`});
    if(st.sinProg>2)
      a.push({lvl:'danger',txt:`${st.sinProg} tareas sin programar en esta categoría — revisar priorización`});
    if(st.trendPct!==null&&st.trendPct>40)
      a.push({lvl:'info',txt:`Categoría en crecimiento +${st.trendPct}% (últimas 4 semanas)`});
    if(st.trendPct!==null&&st.trendPct<-40)
      a.push({lvl:'info',txt:`Categoría en baja ${st.trendPct}% (últimas 4 semanas)`});
    if(st.n>=5&&st.ratio===null)
      a.push({lvl:'info',txt:`Sin HH real registrada — completar tiempos para habilitar análisis de desviación`});
    return a;
  }
  const totalAlerts = groupList.reduce((s,g)=>s+getAlerts(g.st).length,0);

  // ── Ranking ──
  const top6=groupList.slice(0,6), maxHH=top6.length?top6[0].st.totalHHP:1;
  const rankingRows = top6.map(g=>{
    const w=Math.round(g.st.totalHHP/maxHH*100);
    const pct=globalHHP>0?Math.round(g.st.totalHHP/globalHHP*100):0;
    const alerts=getAlerts(g.st);
    const dot=alerts.some(a=>a.lvl==='danger')?'🔴':alerts.some(a=>a.lvl==='warn')?'🟡':'🟢';
    const customBadge=g.isCustom?'<span style="font-size:8px;background:#dbeafe;color:#1d4ed8;border-radius:3px;padding:1px 4px;margin-left:4px">✎</span>':'';
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <div style="width:12px;flex-shrink:0">${dot}</div>
      <div style="min-width:110px;max-width:160px;font-size:10px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${g.label}">${g.label}${customBadge}</div>
      <div style="flex:1;height:14px;background:#f1f5f9;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${w}%;background:${g.isCustom?'#3b82f6':'var(--navy)'};border-radius:3px"></div>
      </div>
      <div style="width:80px;text-align:right;font-size:10px;font-weight:700;color:var(--navy);flex-shrink:0">${g.st.totalHHP}h <span style="color:var(--muted);font-weight:400">(${pct}%)</span></div>
    </div>`;
  }).join('');

  // ── Cards ──
  const cards = groupList.map(({key, label, tasks, st, related, isCustom}) => {
    const safeKey = key.replace(/[^a-z0-9]/gi,'_').substring(0,30);
    const pct       = globalHHP>0?Math.round(st.totalHHP/globalHHP*100):0;
    const alerts    = getAlerts(st);
    const borderCol = alerts.some(a=>a.lvl==='danger')?'var(--red)':alerts.some(a=>a.lvl==='warn')?'#f59e0b':'var(--green)';
    const alertBgCol= alerts.some(a=>a.lvl==='danger')?aBg.danger:alerts.some(a=>a.lvl==='warn')?aBg.warn:'#f0fdf4';

    const ratioColor= st.ratio===null?'var(--muted)':st.ratio>1.3?'var(--red)':st.ratio<0.7?'var(--amber)':'var(--green)';
    const ratioLabel= st.ratio===null?'—':st.ratio>1?`+${Math.round((st.ratio-1)*100)}%`:`-${Math.round((1-st.ratio)*100)}%`;
    const ratioDesc = st.ratio===null?'sin datos':st.ratio>1?'subestima':'sobreestima';
    const cvLabel   = st.cv===null?'—':st.cv<0.3?'Baja':st.cv<0.6?'Media':'Alta';
    const cvColor   = st.cv===null?'var(--muted)':st.cv<0.3?'var(--green)':st.cv<0.6?'var(--amber)':'var(--red)';

    const trendBadge= st.trendPct===null?'':st.trendPct>0
      ?`<span style="font-size:9px;background:#dcfce7;color:#166534;border-radius:3px;padding:1px 5px;margin-left:6px">↑ ${st.trendPct}%</span>`
      :`<span style="font-size:9px;background:#fee2e2;color:#991b1b;border-radius:3px;padding:1px 5px;margin-left:6px">↓ ${st.trendPct}%</span>`;

    const personBadges = Object.entries(st.byPerson).sort((a,b)=>b[1]-a[1]).slice(0,4)
      .map(([p,n])=>`<span style="font-size:10px;background:#f1f5f9;border-radius:4px;padding:2px 7px">${shortName(p)} <strong>${n}</strong></span>`).join(' ');

    const relatedHTML = related.length
      ? `<div style="margin-top:4px;font-size:10px;color:var(--muted)">Términos relacionados: ${related.map(r=>`<span style="background:#e0e7ff;color:#3730a3;border-radius:3px;padding:1px 5px;margin-right:3px">${cNames[r]||r}</span>`).join('')}</div>`
      : '';

    const alertsHTML = alerts.length
      ? alerts.map(a=>`<div style="font-size:10px;color:${aTx[a.lvl]};line-height:1.7">▸ ${a.txt}</div>`).join('')
      : `<div style="font-size:10px;color:var(--green)">✅ Sin alertas — categoría bien gestionada</div>`;

    // Tabla de detalle de tareas (oculta por defecto)
    const colEstado = {'Confirmado':'#22c55e','Programado':'#3b82f6','Por Iniciar':'#64748b','En Proceso':'#f59e0b','Standby':'#94a3b8','Cancelado':'#ef4444'};
    const detalleRows = tasks.map(b => {
      const hhp=parseFloat(b.hhPlan)||0, hhr=parseFloat(b.hhReal)||0;
      const desv=hhp>0&&hhr>0?Math.round((hhr/hhp-1)*100):null;
      const desvTxt=desv===null?'—':desv>0?`<span style="color:var(--red)">+${desv}%</span>`:`<span style="color:var(--green)">${desv}%</span>`;
      const excluidos=cExcl[key]||[];
      const yaExcl=excluidos.includes(b.id);
      const safeK=key.replace(/'/g,"\\'");
      return `<tr style="border-bottom:1px solid #f1f5f9">
        <td style="padding:4px 6px;font-size:11px;color:var(--muted)">#${b.id}</td>
        <td style="padding:4px 6px;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${b.titulo||''}">${(b.titulo||'—').substring(0,35)}${(b.titulo||'').length>35?'…':''}</td>
        <td style="padding:4px 6px;font-size:11px">${shortName(b.responsable||'')}</td>
        <td style="padding:4px 6px;font-size:11px">${b.fechaProg||b.fechaReal||'—'}</td>
        <td style="padding:4px 6px;font-size:11px;text-align:right">${hhp||'—'}h</td>
        <td style="padding:4px 6px;font-size:11px;text-align:right">${hhr||'—'}h</td>
        <td style="padding:4px 6px;font-size:11px;text-align:right">${desvTxt}</td>
        <td style="padding:4px 6px;font-size:11px"><span style="background:${colEstado[b.estado]||'#888'}22;color:${colEstado[b.estado]||'#888'};border-radius:3px;padding:1px 5px;font-size:9px;white-space:nowrap">${b.estado}</span></td>
        <td style="padding:4px 6px;white-space:nowrap">
          <button onclick="abrirModal(${b.id})" style="font-size:9px;padding:2px 6px;border:1px solid var(--border);background:none;border-radius:3px;cursor:pointer;margin-right:3px">Ver</button>
