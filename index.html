function calGetDates() {
  const today = new Date();
  let dates = [], label = '';
  if (_calView === 'dia') {
    const d = new Date(today); d.setDate(d.getDate() + _calOffset);
    dates = [d];
    label = d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  } else if (_calView === 'semana') {
    const mon = new Date(today);
    const dow = today.getDay();
    mon.setDate(today.getDate() - (dow===0?6:dow-1) + _calOffset*7);
    for (let i=0;i<7;i++) { const d=new Date(mon); d.setDate(mon.getDate()+i); dates.push(d); }
    label = `${dates[0].toLocaleDateString('es-CL',{day:'numeric',month:'short'})} – ${dates[6].toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'})}`;
  } else {
    const d = new Date(today.getFullYear(), today.getMonth()+_calOffset, 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    for (let i=1;i<=last;i++) dates.push(new Date(d.getFullYear(),d.getMonth(),i));
    label = d.toLocaleDateString('es-CL',{month:'long',year:'numeric'});
  }
  const el = document.getElementById('calPeriodLbl');
  if (el) el.textContent = label;
  return dates;
}

// ── Core: normalize a session date to YYYY-MM-DD string ───────────
function normSessDate(s) {
  if (s && s._dn !== undefined) return s._dn; // cached
  let d = s.fecha;
  if (d instanceof Date) {
    // Use local date to avoid timezone issues
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    d = `${y}-${m}-${day}`;
  } else {
    d = String(d||'').substring(0,10);
  }
  s._dn = (d >= '2020-01-01' && d <= '2099-12-31') ? d : '';
  return s._dn;
}

// ── Core: normalize time to HH:MM ─────────────────────────────────
function normTime(t) {
  if (!t) return '';
  if (typeof t === 'string') {
    if (t.length === 5) return t; // already HH:MM
    if (t.includes('T')) return t.split('T')[1]?.substring(0,5)||'';
    return t.substring(0,5);
  }
  if (t instanceof Date) return t.toTimeString().substring(0,5);
  return String(t).substring(0,5);
}

// ── Get bloques for a specific person on a specific date ──────────
function getBloquesForPersonOnDate(personName, dateStr) {
  const pName = String(personName||'').trim();
  return BLOQUES.filter(b => {
    if (String(b.responsable||'').trim() !== pName) return false;
    if (['Standby','Cancelado'].includes(b.estado)) return false;
    if (b.estado === 'Programado'  && b.fechaProg  === dateStr) return true;
    if (b.estado === 'Confirmado'  && b.fechaReal  === dateStr) return true;
    if (b.estado === 'En Proceso'  && (b.fechaProg === dateStr || b.fechaReal === dateStr)) return true;
    return false;
  });
}

// ── Main render ───────────────────────────────────────────────────
function calRender() {
  const wrap = document.getElementById('calWrap');
  if (!wrap) return;

  const person = calGetPerson();
  const dates  = calGetDates();
  const todayS = todayStr();

  if (_calView === 'mes') {
    wrap.innerHTML = calRenderMes(dates, person, todayS);
    calRefreshTray(person);
    return;
  }

  const hStart = 7, hEnd = 20, nHours = hEnd - hStart;
  const dateStrs = dates.map(d => dateStr(d));

  // Build header
  const hdrCells = dates.map(d => {
    const ds = dateStr(d);
    const isToday = ds === todayS;
    const dow = d.getDay();
    const isSat = dow===0||dow===6;

    // Saturation for this person on this date
    const blks = getWorkBlocks(ds, person);
    const totalWork = blks ? blks.reduce((s,b)=>s+(b.end-b.start),0)/60 : 0;
    // Include Por Iniciar blocks (planned future) alongside normal states
    const pTrim = String(person||'').trim();
    const dayBloques = BLOQUES.filter(b=>{
      if(String(b.responsable||'').trim()!==pTrim)return false;
      if(['Standby','Cancelado'].includes(b.estado))return false;
      if(b.estado==='Por Iniciar' &&  b.fechaProg===ds) return true;
      if(b.estado==='Programado'  &&  b.fechaProg===ds) return true;
      if(b.estado==='Confirmado'  &&  b.fechaReal===ds) return true;
      if(b.estado==='En Proceso'  && (b.fechaProg===ds||b.fechaReal===ds)) return true;
      return false;
    });
    const _useProg = b=>b.estado==='Programado'||b.estado==='Por Iniciar';
    // Remove only the lunch break from each block interval (same exclusion as totalWork).
    // Do NOT clip to work start/end — overtime before 08:00 or after 17/18h counts toward %.
    // Then merge overlaps so the same minute is never double-counted.
    const lunch = getLunchFor(person, ds);
    const lS = Math.round(lunch.start*60); // lunch start in minutes
    const lE = Math.round(lunch.end*60);   // lunch end in minutes
    const allIvs=[];
    dayBloques.forEach(b=>{
      const ini=_useProg(b)?b.horaInicioProg:b.horaInicio;
      const ter=_useProg(b)?b.horaFinProg:b.horaFin;
      if(ini&&ter&&ini.length===5&&ter.length===5){
        try{
          const bs=t2m(ini),be=t2m(ter);
          if(be<=bs)return;
          // Split interval around lunch break
          if(bs>=lE||be<=lS){
            allIvs.push([bs,be]); // no overlap with lunch
          }else{
            if(bs<lS)allIvs.push([bs,lS]);   // portion before lunch
            if(be>lE)allIvs.push([lE,be]);   // portion after lunch
          }
        }catch(e){}
      }
    });
    allIvs.sort((a,b2)=>a[0]-b2[0]);
    const merged=[];
    allIvs.forEach(([s,e])=>{
      if(!merged.length||s>merged[merged.length-1][1])merged.push([s,e]);
      else merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],e);
    });
    const sesHH=merged.reduce((sum,[s,e])=>sum+(e-s)/60,0);
    const sat = totalWork>0 ? Math.round(sesHH/totalWork*100) : 0;
    const satColor = sat>=80?'#e63329':sat>=60?'#c97a00':sat>0?'#1a7a4a':'';
    const isFer = esFeriado(ds);
    const isAdmin = activeRol() === 'admin';
    const satTxt = isFer
      ? `<div style="font-size:8px;color:#c97a00;font-weight:700;letter-spacing:.2px">FERIADO</div>`
      : sat>0 ? `<div style="font-size:9px;color:${satColor};font-weight:700">${sat}%</div>` : '';
    const ferStyle = isFer ? 'background:#fffbeb;' : '';
    const ferBorder = isFer ? 'border-bottom:3px solid #f59e0b;' : sat>=80?'border-bottom:3px solid #e63329':sat>=60?'border-bottom:3px solid #c97a00':'';
    const ferTip = ` style="${ferStyle}${ferBorder}"`;

    return `<div class="cal-day-hdr ${isToday?'today':''} ${isSat||isFer?'sat-col':''}"${ferTip}>
      <div class="dn">${d.toLocaleDateString('es-CL',{weekday:'short'}).toUpperCase()}</div>
      <div class="dd">${d.getDate()}</div>
      ${satTxt}
    </div>`;
  }).join('');

  // Build columns
  const cols = dates.map(d => {
    const ds = dateStr(d);
    const dow = d.getDay();
    const isSat = dow===0||dow===6;
    const blks = getWorkBlocks(ds, person);
    const isToday = ds === todayS;
    const lunchDay = getLunchFor(person, ds); // per-day lunch (respects overrides)

    // ONLY bloques belonging to this person on this date
    const daySessions = getBloquesForPersonOnDate(person, ds)
      .map(b => {
        const ini = b.estado==='Programado' ? (b.horaInicioProg||'') : (b.horaInicio||'');
        const ter = b.estado==='Programado' ? (b.horaFinProg||'')    : (b.horaFin||'');
        return {...b, _ini: ini, _ter: ter};
      })
      .filter(b => b._ini && b._ter && b._ini.length===5 && b._ter.length===5);

    // Grid cells - hourly for performance (click snaps to nearest 30min anyway)
    const isFerCol = esFeriado(ds);
    const cells = Array.from({length: nHours}, (_,i) => {
      const h = hStart + i;
      const isWork = blks && blks.some(b => h*60>=b.start && (h+1)*60<=b.end+60);
      const isLunch = h >= lunchDay.start && h < lunchDay.end;
      const cls = isSat||isFerCol?'off-hour':isLunch?'lunch-hour':isWork?'work-hour':'off-hour';
      return `<div class="cal-cell ${cls}"
        style="height:${HOUR_H}px"
        data-date="${ds}" data-hour="${h}"
        onclick="calCellClick('${ds}',${h})"
        ondragover="calCellDragOver(event,this)"
        ondragleave="calCellDragLeave(this)"
        ondrop="calCellDrop(event,this,'${ds}',${h})">
        <div class="cal-cell-half" style="height:50%;border-bottom:1px dashed rgba(212,218,230,.4)"
          data-date="${ds}" data-hour="${h+0.5}"
          onclick="event.stopPropagation();calCellClick('${ds}',${h+0.5})"
          ondragover="calCellDragOver(event,this)"
          ondragleave="calCellDragLeave(this)"
          ondrop="calCellDrop(event,this,'${ds}',${h+0.5})"></div>
      </div>`;
    }).join('');

    // Events
    const events = daySessions.map(b => {
      const topPx    = Math.max(0, (t2m(b._ini)/60 - hStart) * HOUR_H);
      const heightPx = Math.max(28, calcHHRaw(b._ini, b._ter) * HOUR_H);
      const est      = getEstadoEfectivo(b);
      const isExpress = b.tipoBloque === 'Express';
      const evtCls   = est === 'Confirmado' ? 'done'
                     : est === 'En Proceso' ? 'inprogress'
                     : isExpress ? 'express' : 'planned';
      const shortCls = heightPx <= 32 ? ' short' : '';
      const icon     = est === 'Confirmado' ? ' ✅' : est === 'En Proceso' ? ' ⏳' : isExpress ? ' ⚡' : ' 📋';
      return `<div class="cal-event ${evtCls}${shortCls}"
        draggable="true"
        style="top:${topPx}px;height:${heightPx}px"
        title="#${b.id} ${b.titulo||''}"
        ondragstart="calEvtDragStart(event,'${b.id}','${ds}','${b._ini}','${b._ter}')"
        ondragend="this.classList.remove('dragging')"
        onclick="event.stopPropagation();abrirModalBloque(${b.id})">
        <div class="cal-event-title">#${b.id} ${(b.titulo||'').substring(0,18)}</div>
        <div class="cal-event-time">${b._ini}–${b._ter}${icon}</div>
      </div>`;
    }).join('');

    // Bloque de almuerzo
    const lDec = getLunchFor(person, ds);
    const hasOv = !!LUNCH_OVERRIDES[`${person}|${ds}`];
    const lTopPx  = Math.max(0, (lDec.start - hStart) * HOUR_H);
    const lHpx    = Math.max(20, (lDec.end - lDec.start) * HOUR_H);
    const isMe = person === SESSION.nombre;
    const lunchBlock = !isSat ? `<div
      style="position:absolute;left:2px;right:2px;top:${lTopPx}px;height:${lHpx}px;
        background:${hasOv?'#fff8e1':'#fef9ec'};border-left:3px solid ${hasOv?'#f59e0b':'#e8a317'};
        border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;color:#856404;
        z-index:4;overflow:hidden;${isMe?'cursor:pointer;':'pointer-events:none;'}"
      title="${isMe?'Clic para editar este día':''}"
      onclick="${isMe?`abrirModalAlmuerzoFecha('${person}','${ds}')`:''}"
    >
      🍽 Almuerzo${hasOv?' ✎':''}
      <br><span style="font-weight:400">${lDec.ini}–${lDec.fin}</span>
    </div>` : '';

    // Now line
    let nowLine = '';
    if (isToday) {
      const now = new Date();
      const topNow = (now.getHours() + now.getMinutes()/60 - hStart) * HOUR_H;
      if (topNow >= 0 && topNow <= nHours*HOUR_H)
        nowLine = `<div class="cal-now-line" style="top:${topNow}px"></div>`;
    }

    return `<div class="cal-col ${isSat?'sat-col':''}${isFerCol?' feriado-col':''}" style="position:relative">
      ${cells}${lunchBlock}${events}${nowLine}
    </div>`;
  }).join('');

  // Hour labels
  const hourLabels = Array.from({length: nHours+1}, (_,i) =>
    `<div class="cal-hour" style="height:${HOUR_H}px">
      <span>${String(hStart+i).padStart(2,'0')}:00</span>
    </div>`).join('');

  wrap.innerHTML = `
  <div class="cal-head" style="position:sticky;top:0;z-index:10">
    <div class="cal-time-col"></div>
    <div class="cal-days-head">${hdrCells}</div>
  </div>
  <div class="cal-body" id="calBody">
    <div class="cal-times">${hourLabels}</div>
    <div class="cal-grid">${cols}</div>
  </div>`;

  // Scroll to work start
  setTimeout(() => {
    const body = document.getElementById('calBody');
    if (body) body.scrollTop = (8 - hStart) * HOUR_H;
    // Also scroll ag-cal-area if present
    const agArea = document.querySelector('.ag-cal-area');
    if (agArea) agArea.scrollTop = (8 - hStart) * HOUR_H;
  }, 60);

  calRefreshTray(person);
  agRenderEquipo();
  agRenderTodaySat();
}

function calRenderMes(dates, person, todayS) {
  const firstDow = (dates[0].getDay() || 7) - 1;
  const days = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const blanks = Array(firstDow).fill('<div></div>');
  const cells = dates.map(d => {
    const ds = dateStr(d);
    const isToday = ds === todayS;
    const daySes = getBloquesForPersonOnDate(person, ds);
    const items = daySes.slice(0,2).map(s =>
      `<div style="font-size:9px;background:#e0f2fe;border-radius:3px;padding:1px 4px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">#${s.id}</div>`
    ).join('');
    const more = daySes.length>2 ? `<div style="font-size:9px;color:var(--muted)">+${daySes.length-2}</div>` : '';
    return `<div style="background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px;min-height:70px;cursor:pointer"
      onclick="_calView='dia';_calOffset=Math.round((new Date('${ds}')-new Date())/86400000);calSwitchView('dia')">
      <div style="font-family:Montserrat,sans-serif;font-size:12px;font-weight:700;${isToday?'color:var(--red)':''}">${d.getDate()}</div>
      ${items}${more}
    </div>`;
  });
  return `<div style="padding:10px">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px">
      ${days.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);font-family:Montserrat,sans-serif">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
      ${[...blanks,...cells].join('')}
    </div>
  </div>`;
}

function calRefreshTray(person) {
  const _p = SESSION.nombre;
  const list = document.getElementById('calTrayList');
  if (!list) return;
  // Clear search when tray is refreshed (task was scheduled)
  const srch = document.getElementById('traySearch');
  if (srch) srch.value = '';

  const hoyTray = todayStr();
  const porIniciar = BLOQUES.filter(b => {
    if (b.responsable !== _p || b.estado !== 'Por Iniciar') return false;
    // Bloques con fecha asignada (recurrentes): solo mostrar si son de los próximos 7 días
    if (b.fechaProg) {
      const dias = Math.round((new Date(b.fechaProg+'T12:00:00') - new Date(hoyTray+'T00:00:00')) / 86400000);
      return dias >= 0 && dias <= 7;
    }
    return true; // Sin fecha: siempre en el tray
  });
  const standby = BLOQUES.filter(b => b.responsable === _p && b.estado === 'Standby');
  const all = [...porIniciar, ...standby];

  // Update count badges (desktop + mobile button)
  const countEl = document.getElementById('agTrayCount');
  if (countEl) countEl.textContent = all.length;
  const mobileCountEl = document.getElementById('agMobileTrayCount');
  if (mobileCountEl) mobileCountEl.textContent = all.length;
  agRenderTodaySat();

  if (all.length === 0) {
    list.innerHTML = `<div style="font-size:11px;color:var(--muted);padding:8px 4px;text-align:center">
      ✅ Sin bloques pendientes</div>`;
    return;
  }

  list.innerHTML = all.map(b => {
    const isStandby = b.estado === 'Standby';
    const tipo = b.tipoBloque || 'Simple';
    const badgeCls = isStandby ? 'stb' : tipo === 'Express' ? 'exp' : 'sim';
    const badgeTxt = isStandby ? '⏸ Standby' : tipo;
    const hh = parseFloat(b.hhPlan) || 0;
    const hhTxt = hh > 0 ? `${hh}h` : '—';
    const area = b.area ? `· ${b.area}` : '';
    const borderColor = isStandby ? '#a16207' : tipo === 'Express' ? '#7e22ce' : '#1e56a8';
    // Deadline badge
    const hoy = todayStr();
    let deadlineBadge = '';
    if (b.fechaLimite) {
      const dias = Math.round((new Date(b.fechaLimite+'T23:59:00') - new Date(hoy+'T00:00:00')) / 86400000);
      const dlColor = dias < 0 ? '#dc2626' : dias === 0 ? '#ea580c' : dias <= 2 ? '#d97706' : '#64748b';
      const dlTxt = dias < 0 ? `⚠️ Venció hace ${Math.abs(dias)}d` : dias === 0 ? '🔴 Vence hoy' : dias === 1 ? '🟠 Vence mañana' : `📅 ${b.fechaLimite}`;
      deadlineBadge = `<div style="font-size:9px;color:${dlColor};font-weight:700;margin-top:2px">${dlTxt}${b.instrucciones?' · 📝 Con instrucciones':''}</div>`;
    }
    const isDelegado = !!b.creadoPor;
    const cardBorder = isDelegado ? '#1e40af' : borderColor;
    const cardBg     = isDelegado ? '#eff6ff' : '';
    const delegHeader = isDelegado ? `
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px;padding:3px 6px;background:#1e40af;border-radius:4px;margin:-2px -2px 5px -2px">
        <span style="font-size:10px;color:#fff;font-weight:700">👔 Asignado por ${shortName(b.creadoPor)}</span>
      </div>` : '';
    const instrHtml = (isDelegado && b.instrucciones) ? `
      <div style="font-size:10px;color:#1e3a5f;background:#dbeafe;border-radius:4px;padding:4px 6px;margin-top:4px;border-left:2px solid #3b82f6">
        📝 ${b.instrucciones.length>80?b.instrucciones.substring(0,80)+'…':b.instrucciones}
      </div>` : '';
    return `<div draggable="true" id="trayTask_${b.id}"
      class="ag-tray-card"
      style="border-left-color:${cardBorder};background:${cardBg};${isDelegado?'border:1px solid #bfdbfe;':''}padding:${isDelegado?'6px 8px':''};"
      onclick="abrirModalProgramarBloque('${b.id}')"
      ondragstart="calTrayDragStart(event,${b.id})"
      ondragend="this.style.opacity='1'"
      title="${isDelegado?'Bloque asignado — clic para ver instrucciones y programar':'Clic para programar / Arrastra al calendario'}">
      ${delegHeader}
      <div class="ag-tc-drag">⠿ arrastrar</div>
      <div class="ag-tc-title">${b.titulo||'Sin título'}</div>
      <div class="ag-tc-meta">
        <span class="ag-tc-id">#${b.id}</span>
        <span>${hhTxt}</span>
        ${b.area?`<span>· ${b.area}</span>`:''}
        <span class="ag-tc-badge ${badgeCls}">${badgeTxt}</span>
      </div>
      ${instrHtml}${deadlineBadge}
    </div>`;
  }).join('');
}

function calFilterTray(q) {
  const list = document.getElementById('calTrayList');
  if (!list) return;
  const term = (q || '').toLowerCase().trim();
  list.querySelectorAll('.ag-tray-card').forEach(card => {
    const title = (card.querySelector('.ag-tc-title')?.textContent || '').toLowerCase();
    const id    = (card.querySelector('.ag-tc-id')?.textContent   || '').toLowerCase();
    const area  = card.textContent.toLowerCase();
    card.style.display = (!term || title.includes(term) || id.includes(term) || area.includes(term)) ? '' : 'none';
  });
  // Show "no results" if all hidden
  let visible = 0;
  list.querySelectorAll('.ag-tray-card').forEach(c => { if(c.style.display!=='none') visible++; });
  let noRes = list.querySelector('.tray-no-results');
  if (!visible && term) {
    if (!noRes) { noRes = document.createElement('div'); noRes.className='tray-no-results'; noRes.style.cssText='font-size:11px;color:var(--muted);padding:10px 4px;text-align:center'; list.appendChild(noRes); }
    noRes.textContent = `Sin resultados para "${q}"`;
  } else if (noRes) noRes.remove();
}

let _calDragTaskId = null;
let _calDragOrigDate = null;
let _calDragOrigIni  = null;

function calTrayDragStart(e, taskId) {
  _calDragTaskId = String(taskId);
  _calDragOrigDate = null;
  e.dataTransfer.setData('text/plain', String(taskId));
  e.dataTransfer.effectAllowed = 'move';
  document.getElementById('trayTask_'+taskId)?.style && (document.getElementById('trayTask_'+taskId).style.opacity='0.5');
}

function calEvtDragStart(e, taskId, ds, ini, ter) {
  _calDragTaskId = String(taskId);
  _calDragOrigDate = ds;
  _calDragOrigIni  = ini;
  e.dataTransfer.setData('text/plain', String(taskId));
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}

function calCellDragOver(e, cell) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  cell.style.background = 'rgba(26,48,80,.12)';
}
function calCellDragLeave(cell) {
  cell.style.background = '';
}

function calCellDrop(e, cell, newDs, newHour) {
  e.preventDefault();
  cell.style.background = '';
  const taskId = _calDragTaskId || e.dataTransfer.getData('text/plain');
  if (!taskId) return;
  const t = BLOQUES.find(x => String(x.id) === String(taskId));
  if (!t) return;

  const hh = parseFloat(t.hhPlan) || 1;
  // Snap to 30-min grid
  const snappedHour = Math.round(newHour * 2) / 2;
  const ini = m2t(Math.round(snappedHour * 60));
  const ter = m2t(Math.round(snappedHour * 60) + Math.round(hh * 60));

  if (_calDragOrigDate && _calDragOrigDate === newDs && _calDragOrigIni === ini) {
    _calDragTaskId = null; _calDragOrigDate = null; _calDragOrigIni = null;
    return; // no change
  }

  _calDragTaskId = null; _calDragOrigDate = null; _calDragOrigIni = null;

  // Open scheduling modal
  abrirModalProgramarBloque(taskId, newDs, ini, ter);
}

function abrirModalProgramarBloque(bloqueId, prefDate=null, prefIni=null, prefTer=null) {
  const b = BLOQUES.find(x => String(x.id) === String(bloqueId));
  if (!b) return;

  const hoy  = todayStr();
  const hh   = parseFloat(b.hhPlan) || 1;
  const fDate = prefDate || b.fechaProg || hoy;
  const fIni  = prefIni  || b.horaInicioProg || '09:00';
  const fTer  = prefTer  || b.horaFinProg    || m2t(t2m(fIni) + Math.round(hh * 60));

  openModal(`
    <div class="mt"><div class="rb"></div>${b.fechaProg ? 'Reprogramar bloque' : 'Programar bloque'}</div>
    <div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:4px">#${b.id} · ${b.titulo}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">${b.tipoBloque||'—'} · ${b.area||'—'} · HHP: ${b.hhPlan||'—'}h</div>

    ${b.fechaProg ? `<div class="al w" style="margin-bottom:10px"><span class="al-ico">📅</span>
      <div class="al-txt">Programado actualmente: <strong>${b.fechaProg} ${b.horaInicioProg}–${b.horaFinProg}</strong></div></div>` : ''}

    <div class="g2" style="margin-bottom:10px">
      <div class="efi fw">
        <label class="rq">Fecha</label>
        <input type="date" id="schDate" value="${fDate}" oninput="schBloqueUpdTer()">
      </div>
      <div class="efi">
        <label class="rq">Hora inicio</label>
        <input type="time" id="schIni" value="${fIni}" oninput="schBloqueUpdTer()">
      </div>
      <div class="efi">
        <label class="rq">Hora fin</label>
        <input type="time" id="schTer" value="${fTer}">
      </div>
    </div>
    ${b.fechaProg ? `
    <div class="efi" style="margin-bottom:10px">
      <label class="rq">Motivo reprogramación</label>
      <select id="schMotivo" style="background:var(--inp);border:1.5px solid var(--border);border-radius:6px;padding:8px 22px 8px 9px;font-size:13px;width:100%">
        <option value="">— seleccionar —</option>${opts('MotivoReprog')||['Cambio de prioridad','Falta de recursos','Cambio de agenda cliente','Imprevisto operativo','Otro'].map(v=>`<option value="${v}">${v}</option>`).join('')}
      </select>
      <input type="text" id="schMotivoOtro" placeholder="Especifica el motivo…"
        style="display:none;margin-top:6px;background:var(--inp);border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;width:100%;box-sizing:border-box">
    </div>` : ''}
    <div class="ma">
      <button class="btn ghost" onclick="cerrarModal()"><span class="bt">Cancelar</span></button>
      <button class="btn" style="background:var(--green)" onclick="confirmarProgramacionBloque('${bloqueId}',${!!b.fechaProg})">
        <span class="st"></span><span class="bt">${b.fechaProg ? 'Reprogramar' : 'Programar'}</span>
      </button>
    </div>`);
  // Conectar evento "Otro" sin inline script
  setTimeout(() => {
    const sel = document.getElementById('schMotivo');
    const inp = document.getElementById('schMotivoOtro');
    if (sel && inp) sel.addEventListener('change', () => {
      inp.style.display = sel.value === 'Otro' ? 'block' : 'none';
    });
  }, 50);
}

function schBloqueUpdTer() {
  const ini = document.getElementById('schIni')?.value;
  const ter = document.getElementById('schTer');
  if (!ini || !ter) return;
  const b = BLOQUES.find(x => String(x.id) === String(_calDragTaskId));
  const hh = b ? (parseFloat(b.hhPlan)||1) : 1;
  ter.value = m2t(t2m(ini) + Math.round(hh*60));
}

async function confirmarProgramacionBloque(bloqueId, esReprog) {
  const fec     = document.getElementById('schDate')?.value;
  const ini     = document.getElementById('schIni')?.value;
  const ter     = document.getElementById('schTer')?.value;
  const mSel    = document.getElementById('schMotivo')?.value || '';
  const mOtro   = document.getElementById('schMotivoOtro')?.value?.trim() || '';
  const motivo  = mSel === 'Otro' ? (mOtro || 'Otro') : mSel;

  if (!fec || !ini || !ter) { toast('Completa fecha y horario','warn'); return; }
  if (esReprog && !motivo) { toast('Indica el motivo de reprogramación','warn'); return; }

  const b = BLOQUES.find(x => String(x.id) === String(bloqueId));
  if (!b) return;

  // Verificar conflicto con almuerzo ANTES de guardar
  const conflict = checkLunchConflict(b.responsable, fec, ini, ter);
  if (conflict) {
    mostrarConflictoAlmuerzo(b, fec, ini, ter, motivo, esReprog, conflict);
    return;
  }

  // Optimistic update — UI responde inmediatamente
  const idx = BLOQUES.findIndex(x => String(x.id) === String(bloqueId));
  if (idx > -1) BLOQUES[idx] = {...BLOQUES[idx], estado:'Programado', fechaProg:fec, horaInicioProg:ini, horaFinProg:ter};
  cerrarModal();
  toast(`✅ Bloque #${b.id} ${esReprog?'reprogramado':'programado'}: ${fec} ${ini}–${ter}`,'ok');
  calRender();

  syncCache();
  // Sync en background — sin bloquear UI
  const syncPromise = esReprog
    ? apiPost({accion:'reprogramar', bloqueId:b.id, titulo:b.titulo, responsable:b.responsable,
        fechaOriginal:b.fechaProg, horaInicioOriginal:b.horaInicioProg, horaFinOriginal:b.horaFinProg,

  if(!i||!f){el.textContent='--';el.className='hhv e';return;}

}

async function cfAccion(bid) {
  const ini = document.getElementById('cf_ini_'+bid)?.value;
  const ter = document.getElementById('cf_ter_'+bid)?.value;
  const fec = document.getElementById('cf_fec_'+bid)?.value || todayStr();
  if (!ini || !ter) { toast('Ingresa hora inicio y término','er'); return; }
  const hh = calcHHRaw(ini, ter);
  if (!hh || hh <= 0) { toast('Verifica los horarios','er'); return; }
  const com = document.getElementById('cf_com_'+bid)?.value || '';

  const campos = {10:'Confirmado', 11:fec, 12:ini, 13:ter, 14:hh};
  if (com) campos[9] = com;

  // Optimistic update
  const idx = BLOQUES.findIndex(x => String(x.id) === String(bid));
  if (idx > -1) {
    BLOQUES[idx] = {...BLOQUES[idx], estado:'Confirmado', fechaReal:fec, horaInicio:ini, horaFin:ter, hhReal:hh};
    if (com) BLOQUES[idx].comentario = com;
  }
  toast('✅ Bloque confirmado','ok');
  document.getElementById('main').innerHTML = vConfirmarBloque();

  syncCache();
  apiPost({accion:'actualizar', id:bid, campos})
    .then(() => apiPost({accion:'actualizarUltimoRegistro', usuario:SESSION.usuario}))
    .catch(() => toast('Error al guardar — recarga la app','er'));
}

async function cfConfirmEstado(bid, accion) {
  const motivo=document.getElementById('cfStateMotivo')?.value||document.getElementById('cfStateJust')?.value||'';
  if(!motivo){toast('La justificación es obligatoria','er');return;}
  const b=BLOQUES.find(x=>String(x.id)===String(bid)); if(!b)return;
  let nuevoEstado='Por Iniciar';
  if(accion==='standby') nuevoEstado='Standby';
  else if(accion==='cancelar') nuevoEstado='Cancelado';

  // Optimistic update
  const idx=BLOQUES.findIndex(x=>String(x.id)===String(bid));
  if(idx>-1) {
    BLOQUES[idx]={...BLOQUES[idx], estado:nuevoEstado};
    if(accion==='reprog'){BLOQUES[idx].fechaProg='';BLOQUES[idx].horaInicioProg='';BLOQUES[idx].horaFinProg='';}
  }
  cerrarModal();
  toast(`Bloque #${bid}: ${nuevoEstado}`,'ok');
  document.getElementById('main').innerHTML=vConfirmarBloque();

  syncCache();
  const campos={10:nuevoEstado};
  const chain = accion==='reprog'
    ? apiPost({accion:'reprogramar', bloqueId:b.id, titulo:b.titulo, responsable:b.responsable,
        fechaOriginal:b.fechaProg, horaInicioOriginal:b.horaInicioProg, horaFinOriginal:b.horaFinProg,
        fechaNueva:'', horaInicioNueva:'', horaFinNueva:'', motivo, esUrgencia:false, reprogramadoPor:SESSION.nombre})
        .then(() => { campos[16]=''; campos[17]=''; campos[18]=''; return apiPost({accion:'actualizar', id:bid, campos}); })
    : apiPost({accion:'actualizar', id:bid, campos});
  chain.catch(() => toast('Error al guardar — recarga la app','er'));
}

async function guardarModal(id){

    2:document.getElementById('mTar')?.value||'',

    11:document.getElementById('mEst')?.value||'',
    12:document.getElementById('mCom')?.value||'',
    15:document.getElementById('mFej')?.value||''
  };

function shortName(n) {
  if (!n) return '—';
  const p = n.split(' ');
  return p.length >= 2 ? p[0] + ' ' + p[1][0] + '.' : n;
}

function barClickable(items, field, tareas, sesiones, cls='') {
  if(!items||!Object.keys(items).length) return '<div class="emp" style="padding:8px">Sin datos</div>';
  const max=Math.max(...Object.values(items),1);
  return Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="br" style="cursor:pointer" onclick="showBarDrill('${field}','${k.replace(/'/g,'').replace(/"/g,'')}')">
      <div class="bl2" title="${k}">${k.length>14?k.substring(0,13)+'…':k}</div>
      <div class="bt2"><div class="bf ${cls}" style="width:${Math.round(v/max*100)}%"></div></div>
      <div class="bv">${fmtHH(v)}h</div>
    </div>`).join('') +
    '<div class="drill op" id="drill_'+field+'" style="display:none;margin-top:8px"></div>';
}

function showBarDrill(field, value) {
  const drillId = 'drill_'+field;
  const existing = document.getElementById(drillId);
  // Close if clicking same
  if(existing&&existing.getAttribute('data-val')===value&&existing.style.display==='block'){
    existing.style.display='none';return;
  }
  const fmap = {nombre:'responsable',tipo:'tipoBloque',tarea:'titulo',area:'area'};
  const bfield = fmap[field]||field;
  const matchTareas = BLOQUES.filter(b=>String(b[bfield]||'')===String(value));
  const html2 = `<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">${value}</div>
    <div class="tl">${matchTareas.slice(0,10).map(b=>`
      <div class="ti2" onclick="abrirModalBloque(${b.id})">
        <span class="tid">#${b.id}</span>
        <div class="tn2"><div class="tna">${b.titulo||''}</div>
        <div class="tme">${shortName(b.responsable)} · HHP:${b.hhPlan||'—'} HHR:${b.hhReal||'0'}</div></div>
        <span class="badge ${BADGE[b.estado]||'bi'}">${b.estado}</span>
      </div>`).join('')||'<div class="emp">Sin bloques</div>'}
    </div>`;
  // Re-render drill in a fixed location
  let drill = document.getElementById(drillId);
  if(!drill){
    // Create global drill panel after the chart
    drill=document.createElement('div');drill.id=drillId;drill.className='drill';
    drill.style.marginTop='8px';
  }
  drill.innerHTML=html2;drill.style.display='block';
  drill.setAttribute('data-val',value);
  // Insert after closest .cw parent
  const bar=event.currentTarget||event.target;
  const cw=bar.closest('.cw');
  if(cw&&!cw.querySelector('#'+drillId))cw.appendChild(drill);
}

// ── PLANIFICACIÓN LEVELS ──────────────────────────────────────────────────
function buildDashPlanLevel(f, level) {
  if (level === 'op')  return buildDashPlan(f);
  if (level === 'tac') return buildDashPlanTactico(f);
  return buildDashPlanEstrategico(f);
}

function buildDashPlanTactico(f) {
  const tareas = filtrarTareas(f);
  const hoy = todayStr();
  const ayer = new Date(); ayer.setDate(ayer.getDate()-1);
  const ayerStr = dateStr(ayer);

  // Tasa de programación mensual
  const conFecha = tareas.filter(t => t.fechaEjecucion).length;
  const tasaProg  = tareas.length > 0 ? Math.round(conFecha/tareas.length*100) : 0;

  // Lead time promedio ingreso → programación
  const conAmbas = tareas.filter(t => t.fechaIngreso && t.fechaEjecucion);
  let leadTime = 0;
  if (conAmbas.length > 0) {
    const totalDays = conAmbas.reduce((s,t) => {
      const d1 = new Date(t.fechaIngreso+'T12:00:00');
      const d2 = new Date(t.fechaEjecucion+'T12:00:00');
      return s + Math.max(0, Math.round((d2-d1)/86400000));
    }, 0);
    leadTime = Math.round(totalDays / conAmbas.length * 10) / 10;
  }

  // Reprogramaciones del mes (use BLOQUES with motivoReprog or vecesReprog)
  const reprogs = BLOQUES.filter(b => f.users.includes(b.responsable) && ((b.vecesReprog||0)>0 || (b.motivoReprog&&b.motivoReprog.trim()!==''))).length;

  // Distribución Eisenhower del mes
  const urgImp  = tareas.filter(t=>t.urgente==='Si'&&t.importante==='Si').length;
  const impNurg = tareas.filter(t=>t.urgente!=='Si'&&t.importante==='Si').length;
  const urgNimp = tareas.filter(t=>t.urgente==='Si'&&t.importante!=='Si').length;
  const ninguno = tareas.filter(t=>t.urgente!=='Si'&&t.importante!=='Si').length;
  const tot = tareas.length || 1;

  return `
  <div class="kg4">
    <div class="kpi">
      <div class="kv ${tasaProg>=70?'pos':'neg'}">${tasaProg}%</div>
      <div class="kl">Tasa de programación mensual ${tip('% de tareas que tienen bloque horario asignado. >70% es saludable.')}</div>
    </div>
    <div class="kpi">
      <div class="kv ${leadTime<=1?'pos':leadTime<=2?'warn':'neg'}">${leadTime} días</div>
      <div class="kl">Lead time ingreso→programación ${tip('Días promedio entre que se ingresa una tarea y se le asigna un bloque horario.')}</div>
    </div>
    <div class="kpi"><div class="kv">${reprogs}</div>
      <div class="kl">Reprogramaciones del período ${tip('Cantidad de veces que se movió trabajo ya planificado.')}</div></div>
    <div class="kpi"><div class="kv warn">${tareas.filter(t=>!t.fechaEjecucion&&!['Listo','Cancelado'].includes(t.estado)).length}</div>
      <div class="kl">Sin programar acumuladas</div></div>
  </div>
  <div class="cw">
    <div class="ct">Distribución Eisenhower del período ${tip('Qué % del tiempo está el equipo en modo reactivo vs planificado. Lo ideal: Importante no urgente > 50%.')}</div>
    ${[['⚡ Urgente + Importante',urgImp,'var(--red)'],['📅 Importante, no urgente',impNurg,'var(--green)'],['👥 Urgente, no importante',urgNimp,'var(--amber)'],['🗑 Ni urgente ni importante',ninguno,'var(--muted)']].map(([l,v,c])=>`
    <div class="br"><div class="bl2" title="${l}">${l.substring(0,22)}…</div>
      <div class="bt2"><div class="bf" style="width:${Math.round(v/tot*100)}%;background:${c}"></div></div>
      <div class="bv">${v} (${Math.round(v/tot*100)}%)</div>
    </div>`).join('')}
  </div>`;
}

function buildDashPlanEstrategico(f) {
  const tareas = filtrarTareas(f);
  // Group by month
  const byMonth = {};
  tareas.forEach(t => {
    const m = (t.fechaIngreso||'').substring(0,7);
    if (!m) return;
    if (!byMonth[m]) byMonth[m] = { total:0, prog:0, urgImp:0 };
    byMonth[m].total++;
    if (t.fechaEjecucion) byMonth[m].prog++;
    if (t.urgente==='Si' && t.importante==='Si') byMonth[m].urgImp++;
  });
  const meses = Object.keys(byMonth).sort();

  return `
  <div class="cw">
    <div class="ct">Tendencia tasa de programación mensual ${tip('Evolución mes a mes. Una curva ascendente indica que el equipo mejora su planificación.')}</div>
    ${meses.length === 0
      ? '<div class="emp">Sin datos históricos suficientes aún</div>'
      : `<div class="tw"><table class="dt">
        <thead><tr><th>Mes</th><th>Tareas</th><th>Programadas</th><th>Tasa</th><th>% Críticas</th></tr></thead>
        <tbody>${meses.map(m => {
          const d = byMonth[m];
          const tasa = d.total > 0 ? Math.round(d.prog/d.total*100) : 0;
          const pctCrit = d.total > 0 ? Math.round(d.urgImp/d.total*100) : 0;
          return `<tr><td>${m}</td><td>${d.total}</td><td>${d.prog}</td>
            <td style="font-weight:700;color:${tasa>=70?'var(--green)':tasa>=50?'var(--amber)':'var(--red)'}">${tasa}%</td>
            <td style="color:${pctCrit>50?'var(--red)':pctCrit>30?'var(--amber)':'var(--green)'}">${pctCrit}%</td></tr>`;
        }).join('')}</tbody>
      </table></div>`
    }
  </div>
  <div class="al info"><span class="al-ico">📊</span>
    <div class="al-txt"><strong>Vista estratégica</strong>
    Empezaste a registrar hace 1 día. En 30-90 días tendrás tendencias significativas para análisis estratégico.</div>
  </div>`;
}

// ── RENDIMIENTO LEVELS ────────────────────────────────────────────────────
async function buildDashRendLevel(f, level) {
  if (level === 'op')  return buildDashRendOp(f);
  if (level === 'tac') return buildDashRendTactico(f);
  return buildDashRendEstrategico(f);
}

function buildDashRendOp(f) {
  const hoy = todayStr();
  // Use BLOQUES directly
  const blkHoy = BLOQUES.filter(b => f.users.includes(b.responsable) && (b.fechaProg===hoy||b.fechaReal===hoy));
  const confHoyB = blkHoy.filter(b=>b.estado==='Confirmado');
  const hhHoy = confHoyB.reduce((s,b)=>s+(parseFloat(b.hhReal)||0),0);
  const hhPlanHoy = blkHoy.reduce((s,b)=>s+(parseFloat(b.hhPlan)||0),0);
  const tasaHoy = hhPlanHoy > 0 ? Math.round(hhHoy/hhPlanHoy*100) : 0;
  const confHoy = confHoyB.length, progHoy = blkHoy.length;

  const cumplRows = f.users.map(p => {
    const dow = new Date(hoy+'T12:00:00').getDay();
    if (!SCHEDULE[dow]) return `<div class="cuc" style="background:var(--off);border-color:var(--border)">
      <div class="cud" style="background:var(--muted)"></div>
      <div><div class="cun">${shortName(p)}</div><div class="cuf">📅 No laborable</div></div></div>`;
    const pBlk = blkHoy.filter(b=>b.responsable===p);
    const pConf = pBlk.filter(b=>b.estado==='Confirmado').length;
    const pHH = pBlk.reduce((s,b)=>s+(parseFloat(b.hhReal)||0),0);
    const gaps = checkGaps(p, hoy);
    const cls = pConf===pBlk.length&&gaps.length===0?'cu-v':gaps.length>0?'cu-r':'cu-a';
    return `<div class="cuc ${cls}"><div class="cud"></div>
      <div><div class="cun">${shortName(p)}</div>
      <div class="cuf">${pConf}/${pBlk.length} bloq. confirmados · ${pHH.toFixed(1)}h ejecutadas</div></div>
    </div>`;
  }).join('');

  return `
  <div class="kg4">
    <div class="kpi"><div class="kv">${hhHoy.toFixed(1)}h</div><div class="kl">HH ejecutadas hoy ${tip('Total de horas reales confirmadas en bloques de hoy.')}</div></div>
    <div class="kpi"><div class="kv ${tasaHoy>=80?'pos':tasaHoy>=50?'warn':'neg'}">${tasaHoy}%</div>
      <div class="kl">Tasa de ejecución hoy ${tip('HH ejecutadas / HH planificadas para hoy × 100.')}</div></div>
    <div class="kpi"><div class="kv">${confHoy}/${progHoy}</div><div class="kl">Bloques confirmados hoy</div></div>
    <div class="kpi"><div class="kv">0h</div>
      <div class="kl">HH extra hoy</div></div>
  </div>
  <div class="card"><div class="cl"><div class="d"></div>Estado de ejecución — Hoy</div>
    <div class="cug">${cumplRows}</div></div>
  <div class="card"><div class="cl"><div class="d"></div>Bloques pendientes de confirmar hoy</div>
    ${blkHoy.filter(b=>b.estado!=='Confirmado'&&b.estado!=='Cancelado').length===0
      ? '<div class="emp">✅ Todos los bloques de hoy están confirmados</div>'
      : `<div class="tl">${blkHoy.filter(b=>b.estado!=='Confirmado'&&b.estado!=='Cancelado').map(b=>`
        <div class="ti2" onclick="goSub('A','confirmar')">
          <span class="tid">#${b.id}</span>
          <div class="tn2"><div class="tna">${b.titulo||''}</div>
          <div class="tme">${shortName(b.responsable)} · HHP:${b.hhPlan||'—'}h</div></div>
          <span class="badge bp">Pendiente</span>
        </div>`).join('')}</div>`}
  </div>`;
}

function buildDashRendTactico(f) {
  const bloques = BLOQUES.filter(b=>{
    if(!f.users.includes(b.responsable))return false;
    if(f.area&&b.area!==f.area)return false;
    const fd=b.fechaProg||b.fechaIngreso||'';
    if(f.desde&&fd<f.desde)return false;
    if(f.hasta&&fd>f.hasta)return false;
    return true;
  });
  const total=bloques.length||1;
  const conf=bloques.filter(b=>b.estado==='Confirmado');
  const totalHHP=bloques.reduce((s,b)=>s+(parseFloat(b.hhPlan)||0),0);
  const totalHHR=conf.reduce((s,b)=>s+(parseFloat(b.hhReal)||0),0);
  const tasa=totalHHP>0?Math.round(totalHHR/totalHHP*100):0;
  // by person
  const byPers={};
  bloques.forEach(b=>{const p=b.responsable||'?';if(!byPers[p])byPers[p]={plan:0,real:0};byPers[p].plan+=parseFloat(b.hhPlan)||0;byPers[p].real+=parseFloat(b.hhReal)||0;});
  const maxR=Math.max(...Object.values(byPers).map(x=>x.real),1);
  return `
  <div class="kg4" style="margin-bottom:14px">
    <div class="kpi"><div class="kv">${bloques.length}</div><div class="kl">Bloques en período</div></div>
    <div class="kpi"><div class="kv">${conf.length}</div><div class="kl">Bloques confirmados</div></div>
    <div class="kpi"><div class="kv">${totalHHR.toFixed(1)}h</div><div class="kl">HH ejecutadas</div></div>
    <div class="kpi"><div class="kv ${tasa>=80?'pos':tasa>=50?'warn':'neg'}">${tasa}%</div><div class="kl">Tasa ejecución HHP vs HHR</div></div>
  </div>
  <div class="cw"><div class="ct">HH por persona</div>
    ${Object.entries(byPers).sort((a,b)=>b[1].real-a[1].real).map(([p,v])=>`
    <div class="br"><div class="bl2">${shortName(p)}</div>
      <div class="bt2"><div class="bf t" style="width:${Math.round(v.real/maxR*100)}%"></div></div>
      <div class="bv">${v.real.toFixed(1)}h real / ${v.plan.toFixed(1)}h plan</div>
    </div>`).join('')||'<div class="emp">Sin datos</div>'}
  </div>`;
}

function buildDashRendEstrategico(f) {
  const tareas = filtrarTareas(f);
  const byMonth = {};
  tareas.forEach(t => {
    const m = (t.fechaIngreso||'').substring(0,7); if(!m)return;
    if(!byMonth[m]) byMonth[m]={plan:0,real:0,done:0,total:0,extra:0};
    byMonth[m].total++;
    byMonth[m].plan += parseFloat(t.hhPlan)||0;
    byMonth[m].real += parseFloat(t.hhReal)||0;
    if(t.estado==='Listo') byMonth[m].done++;
  });
  // extra hours: not tracked in BLOQUES model, skip
  const meses = Object.keys(byMonth).sort();

  return `
  <div class="cw">
    <div class="ct">Rendimiento mensual histórico ${tip('Evolución de HH plan vs real, completitud y horas extra mes a mes.')}</div>
    ${meses.length===0
      ? '<div class="emp">Sin datos históricos suficientes aún — los datos crecerán con el uso</div>'
      : `<div class="tw"><table class="dt">
        <thead><tr><th>Mes</th><th>Tareas</th><th>Completadas</th><th>HHP</th><th>HHR</th><th>Exactitud</th><th>HH Extra</th></tr></thead>
        <tbody>${meses.map(m=>{
          const d=byMonth[m];
          const pct=d.plan>0?Math.round(d.real/d.plan*100):0;
          return `<tr><td>${m}</td><td>${d.total}</td>
            <td style="color:var(--green);font-weight:600">${d.done}</td>
            <td>${Math.round(d.plan*10)/10}h</td><td>${Math.round(d.real*10)/10}h</td>
            <td style="font-weight:700;color:${pct<=110&&pct>=90?'var(--green)':pct<=130&&pct>=70?'var(--amber)':'var(--red)'}">${pct}%</td>
            <td style="color:${d.extra>4?'var(--red)':'inherit'}">${Math.round(d.extra*10)/10}h</td></tr>`;
        }).join('')}</tbody>
      </table></div>`}
  </div>
  <div class="al info"><span class="al-ico">📊</span>
    <div class="al-txt"><strong>Vista estratégica en construcción</strong>
    Con 30+ días de datos verás tendencias de exactitud de estimaciones, evolución de horas extra y tiempo de ciclo por tipo de tarea.</div>
  </div>`;
}

// ── COSTOS LEVELS ─────────────────────────────────────────────────────────
function buildDashCostosLevel(f, level) {
  if (level === 'op')  return buildDashCostosOp(f);
  if (level === 'tac') return buildDashCostosEstrategico(f);
  return buildDashCostosEstrategico(f);
}

function buildDashCostosOp(f) {
  const sesiones = filtrarSesiones(f);
  const tareas   = filtrarTareas(f);
  const defC = {'Luis Sanchez':{normal:12000,extra:16000},'Luis Diaz':{normal:10000,extra:14000},'Yamila Silva':{normal:8000,extra:11000}};
  const costos = {...defC,...COSTOS};
  const fmt = v => '$'+Math.round(v).toLocaleString('es-CL');

  let totalN=0,totalE=0;
  const byCosto = {};
  sesiones.forEach(s=>{
    const hh=parseFloat(s.hh)||0;
    const c=costos[s.responsable]||{normal:10000,extra:14000};
    const isE=s.esExtra==='Sí';
    const costo=hh*(isE?c.extra:c.normal);
    if(isE)totalE+=costo;else totalN+=costo;
    if(!byCosto[s.responsable])byCosto[s.responsable]={normal:0,extra:0};
    if(isE)byCosto[s.responsable].extra+=costo;else byCosto[s.responsable].normal+=costo;
  });

  // Costo urgencias vs planificado
  const sesUrg = sesiones.filter(s=>{
    const b=BLOQUES.find(x=>String(x.id)===String(s.tareaId));
    return b?.urgente==='Si'&&b?.importante==='Si';
  });
  const costoUrg = sesUrg.reduce((sum,s)=>{
    const c=costos[s.responsable]||{normal:10000,extra:14000};
    return sum+(parseFloat(s.hh)||0)*c.normal;
  },0);
  const pctUrg = (totalN+totalE)>0?Math.round(costoUrg/(totalN+totalE)*100):0;

  const persRows = Object.entries(byCosto).map(([p,c])=>`
    <tr><td>${shortName(p)}</td>
      <td style="text-align:right">${fmt(c.normal)}</td>
      <td style="text-align:right;color:${c.extra>0?'var(--amber)':'inherit'}">${fmt(c.extra)}</td>
      <td style="text-align:right;font-weight:700">${fmt(c.normal+c.extra)}</td>
    </tr>`).join('');

  return `
  <div class="kg4">
    <div class="kpi"><div class="kv" style="font-size:16px">${fmt(totalN+totalE)}</div><div class="kl">Costo total período ${tip('Suma del costo de todas las HH trabajadas.')}</div></div>
    <div class="kpi"><div class="kv" style="font-size:16px">${fmt(totalN)}</div><div class="kl">Costo HH normales</div></div>
    <div class="kpi"><div class="kv ${totalE>0?'neg':''}" style="font-size:16px">${fmt(totalE)}</div><div class="kl">Costo HH extra ${tip('Horas trabajadas fuera de horario normal, a tarifa superior.')}</div></div>
    <div class="kpi">
      <div class="kv ${pctUrg>40?'neg':pctUrg>20?'warn':'pos'}">${pctUrg}%</div>
      <div class="kl">% Costo en urgencias ${tip('Qué porcentaje del costo total corresponde a tareas Urgente+Importante. >40% indica alto costo reactivo.')}</div>
      <div class="ks">${fmt(costoUrg)} en modo urgente</div>
    </div>
  </div>
  <div class="card"><div class="cl"><div class="d"></div>Costo por persona — período</div>
    <div class="tw"><table class="dt">
      <thead><tr><th>Persona</th><th style="text-align:right">Costo Normal</th><th style="text-align:right">Costo Extra</th><th style="text-align:right">Total</th></tr></thead>
      <tbody>${persRows||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sin datos</td></tr>'}</tbody>
    </table></div>
  </div>
  <div class="card"><div class="cl"><div class="d"></div>Tareas con mayor costo en el período</div>
    <div class="tw"><table class="dt">
      <thead><tr><th>#</th><th>Tarea</th><th>Resp.</th><th style="text-align:right">HH</th><th style="text-align:right">Costo est.</th></tr></thead>
      <tbody>${tareas.filter(t=>parseFloat(t.hhReal)>0).sort((a,b)=>(parseFloat(b.hhReal)||0)-(parseFloat(a.hhReal)||0)).slice(0,8).map(t=>{
        const c=costos[t.nombre]||{normal:10000,extra:14000};
        const costo=(parseFloat(t.hhReal)||0)*c.normal;
        return `<tr onclick="abrirModal(${t.id})" style="cursor:pointer">
          <td>${t.id}</td>
          <td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${t.tarea}">${t.tarea}</td>
          <td>${shortName(t.nombre)}</td>
          <td style="text-align:right">${t.hhReal}h</td>
          <td style="text-align:right;font-weight:600">${fmt(costo)}</td>
        </tr>`;
      }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted)">Sin datos</td></tr>'}
      </tbody>
    </table></div>
  </div>`;
}

function buildDashCostosEstrategico(f) {
  const tareas   = filtrarTareas(f);
  const defC = {'Luis Sanchez':{normal:12000,extra:16000},'Luis Diaz':{normal:10000,extra:14000},'Yamila Silva':{normal:8000,extra:11000}};
  const costos = {...defC,...COSTOS};
  const fmt = v => '$'+Math.round(v).toLocaleString('es-CL');

  // Cost by month (use BLOQUES directly)
  const byMonth = {};
  BLOQUES.filter(b=>f.users.includes(b.responsable)).forEach(b=>{
    const m=(b.fechaProg||b.fechaIngreso||'').substring(0,7); if(!m)return;
    if(!byMonth[m]) byMonth[m]={normal:0,extra:0,urgs:0};
    const c=costos[b.responsable]||{normal:10000,extra:14000};
    const hh=parseFloat(b.hhReal)||0;
    const costo=hh*c.normal;
    byMonth[m].normal+=costo;
    if(b.urgente==='Si'&&b.importante==='Si') byMonth[m].urgs+=costo;
  });
  const meses=Object.keys(byMonth).sort();

  return `
  <div class="cw">
    <div class="ct">Tendencia de costos mensual ${tip('Evolución del costo total, extra y urgencias mes a mes. El costo de urgencias debe tender a bajar si se mejora la planificación.')}</div>
    ${meses.length===0
      ? '<div class="emp">Sin datos históricos suficientes</div>'
      : `<div class="tw"><table class="dt">
        <thead><tr><th>Mes</th><th style="text-align:right">Costo Normal</th><th style="text-align:right">Costo Extra</th><th style="text-align:right">Costo Urgencias</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${meses.map(m=>{
          const d=byMonth[m];
          const tot=d.normal+d.extra;
          const pctU=tot>0?Math.round(d.urgs/tot*100):0;
          return`<tr><td>${m}</td>
            <td style="text-align:right">${fmt(d.normal)}</td>
            <td style="text-align:right;color:${d.extra>0?'var(--amber)':'inherit'}">${fmt(d.extra)}</td>
            <td style="text-align:right;color:${pctU>40?'var(--red)':'inherit'}">${fmt(d.urgs)} (${pctU}%)</td>
            <td style="text-align:right;font-weight:700">${fmt(tot)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`}
  </div>
  <div class="al info" style="margin-top:8px"><span class="al-ico">💡</span>
    <div class="al-txt"><strong>ROI de planificación</strong>
    Si el % de costo en urgencias baja mes a mes, significa que la app está generando valor real. Con 3+ meses de datos podrás demostrar cuánto dinero ahorra planificar vs ser reactivo.</div>
  </div>`;
}

let nbTipo = '';
let nbEisUrgente = null;
let nbEisImportante = null;
let nbModo = 'propio'; // 'propio' | 'delegar'
let nbRepetir = false;
let nbDiasRep = new Set(); // 1=Lun … 7=Dom

function toggleNBRepetir(on) {
  nbRepetir = on;
  document.getElementById('nbRepOpts').style.display = on ? 'block' : 'none';
  if (on && nbDiasRep.size === 0) {
    // Default: lunes a viernes
    [1,2,3,4,5].forEach(d => { nbDiasRep.add(d); _nbDiaBtn(d); });
    updateNBRepPreview();
  }
}

function toggleNBDia(d) {
  nbDiasRep.has(d) ? nbDiasRep.delete(d) : nbDiasRep.add(d);
  _nbDiaBtn(d);
  updateNBRepPreview();
}

function _nbDiaBtn(d) {
  const btn = document.getElementById('nbDia'+d);
  if (!btn) return;
  const on = nbDiasRep.has(d);
  btn.style.background   = on ? 'var(--navy)' : '#fff';
  btn.style.color        = on ? '#fff'         : '';
  btn.style.borderColor  = on ? 'var(--navy)'  : 'var(--border)';
}

function getNBRepFechas(semanas) {
  const fechas = [];
  const hoy    = new Date(todayStr()+'T12:00:00');
  const dowHoy = hoy.getDay(); // 0=Dom
  const daysToMon = dowHoy === 0 ? -6 : 1 - dowHoy;
  const lunes = new Date(hoy); lunes.setDate(hoy.getDate() + daysToMon);
  for (let w = 0; w < semanas; w++) {
    for (let d = 1; d <= 7; d++) {
      if (!nbDiasRep.has(d)) continue;
      const dia = new Date(lunes);
      dia.setDate(lunes.getDate() + (w * 7) + (d - 1));
      if (dateStr(dia) >= todayStr()) fechas.push(dateStr(dia));
    }
  }
  return fechas.sort();
}

function updateNBRepPreview() {
  const el = document.getElementById('nbRepPreview');
  if (!el) return;
  if (!nbRepetir || nbDiasRep.size === 0) { el.style.display='none'; return; }
  const sem = parseInt(document.getElementById('nbSemanasRep')?.value || '4');
  const fechas = getNBRepFechas(sem);
  const nombres = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const diasNombres = [...nbDiasRep].sort().map(d => nombres[d===7?0:d]).join(', ');
  el.style.display = 'block';
  el.innerHTML = `📋 Se crearán <strong>${fechas.length} bloques</strong> — cada ${diasNombres} por ${sem} semanas<br>
    <span style="color:#64748b">Primeras fechas: ${fechas.slice(0,4).join(' · ')}${fechas.length>4?' …':''}</span>`;
}

function nbSolChange() {
  clearErr(['nbSol']);
  const sol = document.getElementById('nbSol')?.value?.trim();
  const areaEl = document.getElementById('nbAre');
  if (!sol || !areaEl) return;
  // 1. Mapa estático SolArea
  const map = getSolAreaMap();
  if (map[sol]) { areaEl.value = map[sol]; return; }
  // 2. Fallback: área más frecuente del historial
  if (areaEl.value) return;
  const counts = {};
  BLOQUES.filter(b => b.solicitante === sol && b.area).forEach(b => {
    counts[b.area] = (counts[b.area]||0)+1;
  });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  if (top) areaEl.value = top[0];
}
function nbCalcHH() {
  const ini = document.getElementById('nbHIni')?.value;
  const fin = document.getElementById('nbHFin')?.value;
  if (ini && fin) {
    const hh = calcHHRaw(ini, fin);
    document.getElementById('nbHHr').value = hh > 0 ? fmtHH(hh) + ' h' : '';
  }
}

async function guardarNuevoBloque() {
  clearFormError('nbFormError');
  if (!nbTipo) { toast('Selecciona Express o Simple primero','warn'); return; }

  // Leer valores del formulario
  const isDelegando = nbModo === 'delegar' && activeRol() === 'admin';
  const resp = isDelegando
    ? (document.getElementById('nbRespSel')?.value?.trim() || '')
    : (document.getElementById('nbResp')?.value?.trim() || SESSION.nombre);
  const sol  = isDelegando ? SESSION.nombre : (document.getElementById('nbSol')?.value?.trim()  || '');
  const tit  = document.getElementById('nbTit')?.value?.trim()  || '';
  const area = document.getElementById('nbAre')?.value?.trim()  || '';
  const tip  = document.getElementById('nbTip')?.value?.trim()  || '';
  const creadoPor     = isDelegando ? SESSION.nombre : '';
  const fechaLimite   = isDelegando ? (document.getElementById('nbDeadlineF')?.value || '') : '';
  const horaLimite    = isDelegando ? (document.getElementById('nbDeadlineH')?.value || '') : '';
  const instrucciones = isDelegando ? (document.getElementById('nbInstrucciones')?.value?.trim() || '') : '';

  // Mapa id → etiqueta legible
  const LABELS = {
    nbSol:'Solicitante', nbTit:'Título/Descripción', nbAre:'Área', nbTip:'Tipo de bloque',
    nbFechaR:'Fecha de ejecución', nbHIni:'Hora inicio', nbHFin:'Hora fin', nbHHp:'HH Planificadas'
  };

  // En modo delegación: solicitante = admin (auto), responsable = dropdown
  if (isDelegando && !resp) { toast('Selecciona a quién delegas el bloque','warn'); return; }
  const required = isDelegando ? ['nbTit','nbAre','nbTip'] : ['nbSol','nbTit','nbAre','nbTip'];
  const missing = required.filter(id => !document.getElementById(id)?.value?.trim());

  let hhReal = 0, fechaReal = '', horaInicio = '', horaFin = '', hhPlan = 0, comentario = '';

  if (nbTipo === 'express') {
    const fR   = document.getElementById('nbFechaR').value;
    const hIni = document.getElementById('nbHIni').value;
    const hFin = document.getElementById('nbHFin').value;
    comentario = document.getElementById('nbComE').value.trim();
    if (!fR)   missing.push('nbFechaR');
    if (!hIni) missing.push('nbHIni');
    if (!hFin) missing.push('nbHFin');
    if (missing.length === 0) {
      fechaReal  = fR; horaInicio = hIni; horaFin = hFin;
      hhReal = calcHHRaw(hIni, hFin);
      if (hhReal <= 0) {
        showFormError('nbFormError', ['La hora fin debe ser posterior a la hora inicio']);
        markErr(['nbHIni','nbHFin']); return;
      }
    }
  } else {
    const hhp = parseFloat(document.getElementById('nbHHp').value);
    comentario = document.getElementById('nbComS').value.trim();
    if (!hhp || hhp <= 0) missing.push('nbHHp');
    else hhPlan = hhp;
  }

  // Validar Eisenhower
  const eisMissing = [];
  if (nbEisUrgente === null)   eisMissing.push('Urgente (Sí / No)');
  if (nbEisImportante === null) eisMissing.push('Importante (Sí / No)');

  const allMissing = missing.map(id => LABELS[id] || id).concat(eisMissing);
  if (allMissing.length > 0) {
    markErr(missing);
    showFormError('nbFormError', allMissing);
    return;
  }

  const bloque = {
    tipoIngreso:  nbTipo === 'express' ? 'Express' : 'Simple',
    tipoBloque:   tip,
    titulo:       tit,
    area,
    solicitante:  sol,
    responsable:  resp,
    urgente:      nbEisUrgente  ? 'Si' : 'No',
    importante:   nbEisImportante ? 'Si' : 'No',
    comentario,
    estado:       nbTipo === 'express' ? 'Confirmado' : 'Por Iniciar',
    fechaReal,
    horaInicio,
    horaFin,
    hhReal,
    hhPlan,
    fechaProg:       '',
    horaInicioProg:  '',
    horaFinProg:     '',
    creadoPor,
    fechaLimite,
    instrucciones,
  };

  // Optimistic insert — UI responde al instante
  const tempId = `tmp_${Date.now()}`;
  const tempBloque = {
    id: tempId, tipoIngreso: bloque.tipoIngreso, tipoBloque: bloque.tipoBloque,
    titulo: bloque.titulo, area: bloque.area, solicitante: bloque.solicitante,
    responsable: bloque.responsable, urgente: bloque.urgente, importante: bloque.importante,
    comentario: bloque.comentario, estado: bloque.estado,
    fechaReal: bloque.fechaReal||'', horaInicio: bloque.horaInicio||'', horaFin: bloque.horaFin||'',
    hhReal: parseFloat(bloque.hhReal)||0, hhPlan: parseFloat(bloque.hhPlan)||0,
    fechaProg:'', horaInicioProg:'', horaFinProg:'', fechaIngreso: todayStr(),
    creadoPor: bloque.creadoPor||'', fechaLimite: bloque.fechaLimite||'', instrucciones: bloque.instrucciones||''
  };
  BLOQUES.unshift(tempBloque);
  clearFormError('nbFormError');
  const tipoGuardado = nbTipo; const modoGuardado = nbModo;
  const repetirGuardado = nbRepetir; const diasRepGuardados = new Set(nbDiasRep);
  const semanasRep = parseInt(document.getElementById('nbSemanasRep')?.value || '4');
  nbTipo = ''; nbEisUrgente = null; nbEisImportante = null; nbModo = 'propio';
  nbRepetir = false; nbDiasRep = new Set();
  syncCache();

  // ── Repetición: generar un bloque por fecha ──
  if (repetirGuardado && diasRepGuardados.size > 0 && tipoGuardado === 'simple') {
    // Calcular fechas usando los valores guardados
    const _getFechas = (sem) => {
      const fechas = [];
      const hoyD = new Date(todayStr()+'T12:00:00');
      const dow = hoyD.getDay();
      const dToM = dow===0?-6:1-dow;
      const lunes = new Date(hoyD); lunes.setDate(hoyD.getDate()+dToM);
      for (let w=0; w<sem; w++) {
        for (let d=1; d<=7; d++) {
          if (!diasRepGuardados.has(d)) continue;
          const dia = new Date(lunes); dia.setDate(lunes.getDate()+(w*7)+(d-1));
          if (dateStr(dia) >= todayStr()) fechas.push(dateStr(dia));
        }
      }
      return fechas.sort();
    };
    const fechas = _getFechas(semanasRep);
    const nombres = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const diasNombres = [...diasRepGuardados].sort().map(d=>nombres[d===7?0:d]).join(', ');

    // Quitar el bloque temporal único que ya insertamos — se reemplaza por los recurrentes
    BLOQUES = BLOQUES.filter(b => b.id !== tempId);

    // Insertar un bloque por fecha
    const tempIds = fechas.map(f => `tmp_rep_${f}_${Date.now()}`);
    fechas.forEach((fecha, i) => {
      const tb = {...tempBloque, id: tempIds[i], fechaProg: fecha};
      BLOQUES.unshift(tb);
    });
    syncCache();
    toast(`✅ ${fechas.length} bloques creados — cada ${diasNombres} por ${semanasRep} semanas`, 'ok');
    goSub('A','bloques');

    // Guardar en backend en paralelo
    fechas.forEach((fecha, i) => {
      const bloqueRep = {...bloque, fechaProg: fecha};
      apiPost({accion:'insertar', bloque: bloqueRep})
        .then(r => {
          if (r?.ok) {
            const ti = BLOQUES.findIndex(b => b.id === tempIds[i]);
            if (ti > -1) BLOQUES[ti].id = r.id;
            syncCache();
          } else {
            BLOQUES = BLOQUES.filter(b => b.id !== tempIds[i]);
            syncCache();
          }
        }).catch(() => {
          BLOQUES = BLOQUES.filter(b => b.id !== tempIds[i]);
          syncCache();
        });
    });
    return;
  }

  // ── Bloque único (comportamiento normal) ──
  const toastMsg = tipoGuardado==='express' ? '✅ Bloque Express guardado y confirmado'
    : modoGuardado==='delegar' ? `✅ Bloque delegado a ${resp} — aparece en su bandeja Por Iniciar`
    : '✅ Bloque Simple creado. Prográmalo desde la Agenda';
  toast(toastMsg,'ok');
  goSub('A','bloques');

  apiPost({accion:'insertar', bloque})
    .then(r => {
      if (r?.ok) {
        const ti = BLOQUES.findIndex(b => b.id === tempId);
        if (ti > -1) BLOQUES[ti].id = r.id;
        if (tipoGuardado === 'express') apiPost({accion:'actualizarUltimoRegistro', usuario:SESSION.usuario});
        syncCache();
        if (currentSub === 'bloques') document.getElementById('main').innerHTML = vBloques();
      } else {
        BLOQUES = BLOQUES.filter(b => b.id !== tempId);
        syncCache();
        toast('Error al guardar: '+(r?.error||''),'er');
        if (currentSub === 'bloques') document.getElementById('main').innerHTML = vBloques();
      }
    })
    .catch(() => {
      BLOQUES = BLOQUES.filter(b => b.id !== tempId);
      syncCache();
      toast('Error de conexión — intenta de nuevo','er');
      if (currentSub === 'bloques') document.getElementById('main').innerHTML = vBloques();
    });
}

async function guardarTarea() {
  if(!taskType){toast('Elige el tipo de tarea primero','er');return;}
  const miss=validate([{id:'tTar',label:'Descripción'},{id:'tAre',label:'Área'},{id:'tTip',label:'Tipo'},{id:'tHHp',label:'HH Planificadas'}]);
  if(miss.length>0){toast('Falta: '+miss.join(', '),'er');return;}
  if(taskType==='express'){
    const ini=document.getElementById('tHinE')?.value,ter=document.getElementById('tHterE')?.value;
    if(!ini||!ter){toast('Ingresa hora inicio y término','er');return;}
    const cfx=checkOverlap(SESSION.nombre,todayStr(),ini,ter);
    if(cfx.length>0&&!document.getElementById('chkOvlp')?.checked){toast('Confirma el traslape en la alerta','er');return;}
  }
  const taskType_saved=taskType;
  const bloques_saved=[...bloques];
  const btn=document.getElementById('btnT');if(btn){btn.disabled=true;btn.classList.add('ld');}
  const fec=todayStr();
  const fej=document.getElementById('tFej')?.value||'';
  // Determine fechaEjecucion based on task type
  // For simple: only programmed if BOTH date AND start time are filled
  let fechaEjec='';
  if(taskType==='simple') {
    const _fd=document.getElementById('tFej')?.value||'';
    const _fi=document.getElementById('tHini')?.value||'';
    const _ft=document.getElementById('tHter')?.value||'';
    fechaEjec = (_fd&&_fi&&_ft) ? _fd : ''; // requires date+ini+tero count as programmed
  } else if(taskType==='compuesta'&&bloques.length>0) {
    fechaEjec=bloques[0].fecha||'';
  }

  const estado=taskType==='express'?'En Proceso':(fechaEjec?'Programada':'Por Iniciar');
  const urg=eisUrgente===true?'Si':eisUrgente===false?'No':'';
  const imp=eisImportante===true?'Si':eisImportante===false?'No':'';

  const comField = taskType==='compuesta'?document.getElementById('tComC')?.value:document.getElementById('tCom')?.value;
  const fila=[nextId,SESSION.nombre,
    document.getElementById('tTar').value.trim(),
    document.getElementById('tSol')?.value||'',
    document.getElementById('tAre').value,document.getElementById('tTip').value,
    urg,imp,
    parseFloat(document.getElementById('tHHp').value)||'',
    fec,document.getElementById('tFco')?.value||'',estado,
    comField||'',0,0,
    fechaEjec];
  // Capture DOM values BEFORE any async calls
  const express_ini = taskType_saved==='express' ? (document.getElementById('tHinE')?.value||'') : '';
  const express_ter = taskType_saved==='express' ? (document.getElementById('tHterE')?.value||'') : '';

  // Show clear status to user
  const statusEl = document.getElementById('btnTTxt');
  if(statusEl) statusEl.textContent = 'Guardando... (puede tardar 5-10 seg)';

  try {
    const result = await apiPost({accion:'insertar',tabla:'Tareas',fila});
    if(statusEl) statusEl.textContent = 'Guardado ✅';

    const newId = nextId;
    const nt={id:newId,nombre:SESSION.nombre,tarea:fila[2],solicitante:fila[3],area:fila[4],tipo:fila[5],
      urgente:fila[6],importante:fila[7],hhPlan:fila[8],fechaIngreso:fec,fechaComp:fila[10],
      estado,comentario:fila[12],hhReal:0,nSes:0,fechaEjecucion:fila[15]};
    TAREAS.push(nt);
    nextId++;

    // Express: save session and close task
    if(taskType_saved==='express' && express_ini && express_ter){
      const hh=calcHHRaw(express_ini,express_ter);
      if(hh>0){
        await apiPost({accion:'insertar',tabla:'Sesiones',
          fila:[newId,fila[2],SESSION.nombre,fec,express_ini,express_ter,hh,'Express',fec,'No','']});
        await apiPost({accion:'actualizar',tabla:'Tareas',id:newId,campos:{11:'Listo',13:hh,14:1}});
        TAREAS[TAREAS.length-1].estado='Listo';
        TAREAS[TAREAS.length-1].hhReal=hh;
        TAREAS[TAREAS.length-1].nSes=1;
        SESIONES.push({tareaId:newId,tareaNombre:fila[2],responsable:SESSION.nombre,
          fecha:fec,inicio:express_ini,termino:express_ter,hh,esExtra:'No',motivoExtra:''});
      }
    }

    // Compuesta: save planned blocks
    if(taskType_saved==='compuesta'&&bloques_saved.length>0){
      for(const b of bloques_saved){
        if(b.fecha&&b.inicio&&b.termino){
          const hhB=calcHHRaw(b.inicio,b.termino);
          await apiPost({accion:'insertar',tabla:'Sesiones',
            fila:[newId,fila[2],SESSION.nombre,b.fecha,b.inicio,b.termino,hhB,'[Bloque planificado]',fec,'No','']});
          SESIONES.push({tareaId:newId,tareaNombre:fila[2],responsable:SESSION.nombre,
            fecha:b.fecha,inicio:b.inicio,termino:b.termino,hh:hhB,
            comentario:'[Bloque planificado]',esExtra:'No',motivoExtra:''});
        }
      }
    }

    invalidateCache();
    apiPost({accion:'actualizarUltimoRegistro',usuario:SESSION.usuario});
    toast(taskType_saved==='express'?'⚡ Express registrada':'✅ Tarea guardada','ok');
    taskType='';eisUrgente=null;eisImportante=null;
    goSub('A','agenda')
  }catch(e){
    console.error('guardarTarea error:', e);
    toast('Error: ' + (e.message||'revisar conexión') + ' — intenta de nuevo','er');
    const statusEl2=document.getElementById('btnTTxt');
    if(statusEl2) statusEl2.textContent='Reintentar';
  }
  if(btn){btn.disabled=false;btn.classList.remove('ld');}
  const sf=document.getElementById('btnTTxt');if(sf&&sf.textContent==='Guardando... (puede tardar 5-10 seg)')sf.textContent='Guardar';
}

async function guardarSesion() {
  const miss=validate([{id:'sTid',label:'Tarea'},{id:'sFec',label:'Fecha'},{id:'sIni',label:'Hora inicio'},{id:'sTer',label:'Hora término'}]);
  if(miss.length>0){toast('Falta: '+miss.join(', '),'er');return;}
  const tid=document.getElementById('sTid').value,fec=document.getElementById('sFec').value;
  const ini=document.getElementById('sIni').value,ter=document.getElementById('sTer').value;
  const hh=calcHHRaw(ini,ter);
  if(!hh||hh<=0){toast('Verifica los horarios','er');return;}
  const cfx=checkOverlap(SESSION.nombre,fec,ini,ter);
  if(cfx.length>0&&!document.getElementById('chkOvlp')?.checked){toast('Confirma el traslape en la alerta','er');return;}
  const btn=document.getElementById('btnS');if(btn){btn.disabled=true;btn.classList.add('ld');}
  const t=TAREAS.find(x=>String(x.id)===String(tid));
  const hoy=todayStr();
  const motExtra=esExtra?(document.getElementById('sMotExtra')?.value||''):'';
  try {
    await apiPost({accion:'insertar',tabla:'Sesiones',fila:[tid,t?.tarea||'',SESSION.nombre,fec,ini,ter,hh,document.getElementById('sCom')?.value||'',hoy,esExtra?'Sí':'No',motExtra]});
    if(t){
      const idx=TAREAS.findIndex(x=>String(x.id)===String(tid));
      const nHH=Math.round(((parseFloat(t.hhReal)||0)+hh)*100)/100;
      const nN=(parseInt(t.nSes)||0)+1;
      await apiPost({accion:'actualizar',tabla:'Tareas',id:tid,campos:{13:nHH,14:nN}});
      if(idx>-1){TAREAS[idx].hhReal=nHH;TAREAS[idx].nSes=nN;}
      SESIONES.push({tareaId:tid,tareaNombre:t.tarea,responsable:SESSION.nombre,fecha:fec,inicio:ini,termino:ter,hh,esExtra:esExtra?'Sí':'No',motivoExtra:motExtra});
    }
    await apiPost({accion:'actualizarUltimoRegistro',usuario:SESSION.usuario});
    invalidateCache();
    esExtra=false;toast(`Sesión registrada: ${hh}h`,'ok');goSub('A','sesion');
  }catch(e){
    console.error('guardarTarea error:', e);
    toast('Error: ' + (e.message||'revisar conexión') + ' — intenta de nuevo','er');
    const statusEl2=document.getElementById('btnTTxt');
    if(statusEl2) statusEl2.textContent='Reintentar';
  }
  if(btn){btn.disabled=false;btn.classList.remove('ld');}
}

function filtrarTareas(f) {
  const users = f.users||[];
  return BLOQUES.filter(b=>{
    if(users.length>0&&!users.includes(b.responsable))return false;
    if(f.area&&b.area!==f.area)return false;
    if(f.tipo&&b.tipoBloque!==f.tipo)return false;
    if(f.est&&b.estado!==f.est)return false;
    const fd=b.fechaProg||b.fechaIngreso||'';
    if(f.desde&&fd<f.desde)return false;
    if(f.hasta&&fd>f.hasta)return false;
    return true;
  }).map(b=>({
    id:b.id, tarea:b.titulo||'', nombre:b.responsable||'',
    tipo:b.tipoBloque||'', area:b.area||'',
    urgente:b.urgente||'', importante:b.importante||'',
    hhPlan:b.hhPlan||0, hhReal:b.hhReal||0,
    estado:b.estado||'', fechaIngreso:b.fechaIngreso||'',
    fechaEjecucion:b.fechaProg||b.fechaReal||'',
    fechaComp:b.fechaProg||'', solicitante:b.solicitante||''
  }));
}

function filtrarSesiones(f) {
  const users = f.users||[];
  return BLOQUES.filter(b=>{
    if(users.length>0&&!users.includes(b.responsable))return false;
    const fd=b.fechaReal||b.fechaProg||'';
    if(f.desde&&fd<f.desde)return false;
    if(f.hasta&&fd>f.hasta)return false;
    return true;
  }).map(b=>({
    responsable:b.responsable||'', fecha:b.fechaReal||b.fechaProg||'',
    hh:b.hhReal||0, tareaId:b.id,
    comentario:b.notas||'', esExtra:'', motivoExtra:''
  }));
}

function bar(items, cls='', maxOverride=null) {
  if(!items||!Object.keys(items).length)return'<div class="emp" style="padding:8px">Sin datos</div>';
  const max=maxOverride||Math.max(...Object.values(items),1);
  return Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="br">
      <div class="bl2" title="${k}">${k}</div>
      <div class="bt2"><div class="bf ${cls}" style="width:${Math.round(v/max*100)}%"></div></div>
      <div class="bv">${fmtHH(v)}h</div>
    </div>`).join('');
}

function barClickable(items, field, tareas, sesiones, cls='') {
  if(!items||!Object.keys(items).length) return '<div class="emp" style="padding:8px">Sin datos</div>';
  const max=Math.max(...Object.values(items),1);
  return Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="br" style="cursor:pointer" onclick="showBarDrill('${field}','${k.replace(/'/g,'').replace(/"/g,'')}')">
      <div class="bl2" title="${k}">${k.length>14?k.substring(0,13)+'…':k}</div>
      <div class="bt2"><div class="bf ${cls}" style="width:${Math.round(v/max*100)}%"></div></div>
      <div class="bv">${fmtHH(v)}h</div>
    </div>`).join('') +
    '<div class="drill op" id="drill_'+field+'" style="display:none;margin-top:8px"></div>';
}

function showBarDrill(field, value) {
  const drillId = 'drill_'+field;
  const existing = document.getElementById(drillId);
  // Close if clicking same
  if(existing&&existing.getAttribute('data-val')===value&&existing.style.display==='block'){
    existing.style.display='none';return;
  }
  const fmap = {nombre:'responsable',tipo:'tipoBloque',tarea:'titulo',area:'area'};
  const bfield = fmap[field]||field;
  const matchTareas = BLOQUES.filter(b=>String(b[bfield]||'')===String(value));
  const html2 = `<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">${value}</div>
    <div class="tl">${matchTareas.slice(0,10).map(b=>`
      <div class="ti2" onclick="abrirModalBloque(${b.id})">
        <span class="tid">#${b.id}</span>
        <div class="tn2"><div class="tna">${b.titulo||''}</div>
        <div class="tme">${shortName(b.responsable)} · HHP:${b.hhPlan||'—'} HHR:${b.hhReal||'0'}</div></div>
        <span class="badge ${BADGE[b.estado]||'bi'}">${b.estado}</span>
      </div>`).join('')||'<div class="emp">Sin bloques</div>'}
    </div>`;
  // Re-render drill in a fixed location
  let drill = document.getElementById(drillId);
  if(!drill){
    // Create global drill panel after the chart
    drill=document.createElement('div');drill.id=drillId;drill.className='drill';
    drill.style.marginTop='8px';
  }
  drill.innerHTML=html2;drill.style.display='block';
  drill.setAttribute('data-val',value);
  // Insert after closest .cw parent
  const bar=event.currentTarget||event.target;
  const cw=bar.closest('.cw');
  if(cw&&!cw.querySelector('#'+drillId))cw.appendChild(drill);
}

function semaforo(val, verde, amarillo, invertido=false) {
  // invertido: menor = mejor (ej: reactividad)
  let color, ico;
  if (!invertido) {
    if (val >= verde) { color='var(--green)'; ico='🟢'; }
    else if (val >= amarillo) { color='var(--amber)'; ico='🟡'; }
    else { color='var(--red)'; ico='🔴'; }
  } else {
    if (val <= verde) { color='var(--green)'; ico='🟢'; }
    else if (val <= amarillo) { color='var(--amber)'; ico='🟡'; }
    else { color='var(--red)'; ico='🔴'; }
  }
  return { color, ico };
}
